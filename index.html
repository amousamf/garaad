const fmtDay = s => { try{ return new Date(s+'T12:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short'}); }catch(e){ return s; } };
/* ---------- the journey map on the report: skills of the child's class, from Start to the next class ---------- */
const MATH_SKILL = {count:'Numbers', findnum:'Numbers', order:'Numbers', place:'Numbers', sequence:'Numbers',
  shapes:'Shapes and colours', colours:'Shapes and colours', sizes:'Comparing', more:'Comparing', compare:'Comparing',
  odd:'Patterns', pattern:'Patterns', logic:'Patterns',
  addpics:'Plus and minus', takeaway:'Plus and minus', addsub:'Plus and minus', missing:'Plus and minus', doubles:'Plus and minus', story:'Plus and minus',
  skip:'Times and groups', groups:'Times and groups', times:'Times and groups', divide:'Times and groups',
  clock:'Time and money', money:'Time and money', fractions:'Fractions', decimals:'Fractions', percent:'Fractions',
  area:'Problem solving', orderops:'Problem solving', words:'Problem solving'};
const skillOfGame = id => MATH_SKILL[id] || (GAMES[id] && GAMES[id].skill) || null;
const NEXT_CLASS = {'KG1':'KG2', 'KG2':'KG3', 'KG3':'Standard 1', 'Standard 1':'Standard 2', 'Standard 2':'Standard 3'};
function classKey(name){ if(CLASS_GAMES[name]) return name; const c=classCfg(name); return Object.keys(CLASS_GAMES).find(k=>CLASS_GAMES[k]===c)||'Standard 2'; }
const STRONG = 0.7;   // a skill is "strong" once 70% of its levels are passed
function journeyOf(className, rounds){
  const key=classKey(className), cfg=CLASS_GAMES[key], caps=cfg.caps||{}, order=[], games={};
  for(let i=0;i<Math.max(cfg.maths.length, cfg.english.length);i++) [cfg.maths[i], cfg.english[i]].forEach(id=>{   // maths and English side by side, easiest first
    const s=id&&skillOfGame(id); if(!s) return; if(!games[s]){ games[s]=[]; order.push(s); } games[s].push(id); });
  const passed={}; (rounds||[]).forEach(r=>{ if(r.stars>0 && r.level>0) (passed[r.game]=passed[r.game]||new Set()).add(r.level); });

async function downloadPilotCSV(tok, schoolId, btn){
  await busy(btn, async()=>{
    try{
      const rows=await rpc('pilot_export', {p_token:tok, p_school_id:schoolId||null}) || [];
      if(!rows.length){ toast('No children to export yet'); return; }
      const cols=Object.keys(rows[0]), q=v=>{ if(v===null||v===undefined) return ''; const s=String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
      const csv=[cols.join(',')].concat(rows.map(r=>cols.map(c=>q(r[c])).join(','))).join('\n');
      const d=new Date(), a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
      a.download=`garaad-pilot-${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}.csv`; document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
    }catch(e){ toast(serr(e)); }
  });
}

async function adminLoad(){

}

function admFamiliesHTML(d){
  if(!FAM.data){ loadPlaces().then(()=>{ if(current==='sAdmin') renderAdmin(); }).catch(()=>{}); }
  const cname = code => { const c=countryOf(code); return c ? c.name : (code||''); };
  const all=d.families||[], st=d.settings||{};
  const countries=[...new Set(all.map(f=>f.country).filter(Boolean))].sort((a,b)=>cname(a).localeCompare(cname(b)));
  if(ADM.fc && !countries.includes(ADM.fc)) ADM.fc='';
  const regions=[...new Set(all.filter(f=>!ADM.fc || f.country===ADM.fc).map(f=>f.region).filter(Boolean))].sort();
  if(ADM.fr && !regions.includes(ADM.fr)) ADM.fr='';
  const shown=all.filter(f=>(!ADM.fc || f.country===ADM.fc) && (!ADM.fr || f.region===ADM.fr));
  const wantN=shown.filter(f=>f.wants_group && !f.blocked && f.whatsapp).length;
  const row = f => {
    const where=[f.location, f.region, f.country?cname(f.country):''].filter(Boolean).map(esc).join(', ');
    const chips=[f.blocked?'<span class="chip warn">Blocked</span>':'', f.code?`<span class="chip">Code ${esc(f.code)}</span>`:'',
      f.registered && !f.pin_set?'<span class="chip">PIN reset</span>':'', f.wants_group?'<span class="chip">Wants group</span>':''].join(' ');
    const wa=f.whatsapp?`<a href="https://wa.me/${esc(String(f.whatsapp).replace(/\D/g,''))}" target="_blank" rel="noopener">${esc(f.whatsapp)}</a>`:'';
    const meta=[wa, where, `${f.children||0} child${(f.children||0)===1?'':'ren'}`, f.created_at?'joined '+esc(new Date(f.created_at).toLocaleDateString()):''].filter(Boolean).join(' · ');
    return `<div class="trow"><div><b>${esc(f.name||'(no name)')}</b> ${chips}<small>${meta}</small></div>
      <div class="btns">${f.registered?`<button class="btn small" data-a="freset" data-fid="${esc(f.id)}">${ADM.arm==='freset'+f.id?'Tap again to reset':'Reset PIN'}</button>`:''}
      <button class="btn small" data-a="fblock" data-fid="${esc(f.id)}" data-block="${f.blocked?'0':'1'}">${f.blocked?'Unblock':(ADM.arm==='fblock'+f.id?'Tap again to block':'Block')}</button></div></div>`;
  };
  return `<div class="card panel adm"><h3><span>Families</span><span class="chip">${all.length}</span></h3>
      <p>Parents register themselves for free. ${shown.length!==all.length?`Showing ${shown.length} of ${all.length}. `:''}${wantN} want to join the parents' WhatsApp group.</p>
      ${all.length?`<div class="inline">

        <select class="input" id="afRegion" aria-label="Filter by region"><option value="">All regions</option>${regions.map(r=>`<option value="${esc(r)}" ${ADM.fr===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div>
      <div class="tlist">${shown.map(row).join('') || '<p>No families here.</p>'}</div>
      ${wantN?`<div class="btns"><button class="btn small" data-a="copygroup">Copy numbers that want the group</button></div>`:''}`
      : '<p>No families yet.</p>'}
    </div>
    <div class="card panel adm"><h3>WhatsApp links</h3>
      <p>Parents who tick the box see the group link after registering. The admin number is used for every “Contact admin” link.</p>
      <label class="label" for="setGroup">Parents' group invite link</label>
      <div class="inline"><input class="input" id="setGroup" maxlength="200" placeholder="https://chat.whatsapp.com/…" value="${esc(st.parents_group_link||'')}"><button class="btn small" data-a="setgroup">Save</button></div>

      <div class="inline"><input class="input" id="setAdminWa" type="tel" maxlength="20" placeholder="252 61 234 5678" value="${esc(st.admin_whatsapp||'')}"><button class="btn small" data-a="setadminwa">Save</button></div>
    </div>`;

async function adminAction(a, el){
  const call = async (fn, args, okMsg) => { try{ const r=await rpc(fn, Object.assign({p_token:ADM.tok}, args)); if(r && r.ok===false){ ADM.err=serr(r.error); renderAdmin(); return false; } ADM.msg=okMsg||''; ADM.err=''; await adminLoad(); return true; }
    catch(e){ if(e.code==='invalid_token'||e.code==='admin_only'){ ADM.tok=null; ADM.err='Please log in again.'; } else ADM.err=serr(e); renderAdmin(); return false; } };
  if(a==='login'){ const pin=($('aPin').value||'').trim(); if(!pin) return setErr('aErr','Type the admin PIN.');
    return busy(el, async()=>{ try{ const r=await rpc('admin_login', {p_pin:pin}); if(!r.ok) return setErr('aErr', r.error==='wrong_pin'?'That PIN is not right. After 5 wrong tries admin login locks for 15 minutes.':serr(r.error));
      ADM.tok=r.token; ADM.data=null; ADM.err=''; renderAdmin(); adminLoad(); }catch(e){ setErr('aErr', serr(e)); } }); }
  if(a==='logout'){ if(ADM.tok) rpc('logout', {p_token:ADM.tok}).catch(()=>{}); ADM.tok=null; ADM.data=null; ADM.pilot=null; return renderAdmin(); }
  if(a==='pilot'){ ADM.pilot={sid:el.dataset.sid||null, name:el.dataset.sname||'', data:null}; ADM.err=''; renderAdmin(); window.scrollTo(0,0);
    try{ ADM.pilot.data=await rpc('pilot_summary', {p_token:ADM.tok, p_school_id:ADM.pilot.sid}); }
    catch(e){ if(e.code==='invalid_token'||e.code==='not_allowed'){ ADM.tok=null; ADM.pilot=null; ADM.err='Please log in again.'; } else ADM.pilot.data={error:serr(e)}; }
    return renderAdmin(); }
  if(a==='pilot-back'){ ADM.pilot=null; return renderAdmin(); }
  if(a==='pilot-csv') return downloadPilotCSV(ADM.tok, ADM.pilot&&ADM.pilot.sid, el);
  if(a==='reset'){ const k='reset'+el.dataset.tid; if(ADM.arm!==k){ ADM.arm=k; return renderAdmin(); } ADM.arm=''; return busy(el, ()=>call('admin_reset_pin', {p_teacher_id:el.dataset.tid}, 'PIN reset. The teacher chooses a new PIN at their next login.')); }
  if(a==='role') return busy(el, ()=>call('admin_set_role', {p_teacher_id:el.dataset.tid, p_role:el.dataset.role}, el.dataset.role==='principal'?'Now a principal. The new role applies at their next login.':'Now a teacher. The new role applies at their next login.'));
  if(a==='addclass'){ const i=$('cls-'+el.dataset.sid), name=(i&&i.value||'').trim(); if(!name) return; return busy(el, ()=>call('admin_add_class', {p_school_id:el.dataset.sid, p_name:name}, `Class ${name} added.`)); }
  if(a==='newschool'){ const name=$('nsName').value.trim(), code=$('nsCode').value.trim().toUpperCase(); if(!name||!code){ ADM.err='Type the school name and a code.'; return renderAdmin(); }
    return busy(el, ()=>call('admin_create_school', {p_name:name, p_code:code}, `School created. Its code is ${code}.`)); }
  if(a==='newfamily'){ const name=$('nfName').value.trim(), code=$('nfCode').value.trim().toUpperCase(); if(!code){ ADM.err='Type a family code.'; return renderAdmin(); }
    return busy(el, ()=>call('admin_create_family', {p_name:name, p_code:code}, `Family code ${code} created.`)); }
  if(a==='freset'){ const k='freset'+el.dataset.fid; if(ADM.arm!==k){ ADM.arm=k; return renderAdmin(); } ADM.arm=''; return busy(el, ()=>call('admin_reset_family_pin', {p_family_id:el.dataset.fid}, 'PIN reset. The family chooses a new PIN at their next login.')); }
  if(a==='fblock'){ const block=el.dataset.block==='1', k='fblock'+el.dataset.fid; if(block && ADM.arm!==k){ ADM.arm=k; return renderAdmin(); } ADM.arm='';
    return busy(el, ()=>call('admin_block_family', {p_family_id:el.dataset.fid, p_blocked:block}, block?'Family blocked and signed out.':'Family unblocked.')); }
  if(a==='setgroup'){ const v=($('setGroup').value||'').trim(); return busy(el, ()=>call('admin_set_setting', {p_key:'parents_group_link', p_value:v}, v?'Group link saved.':'Group link removed.')); }
  if(a==='setadminwa'){ const v=($('setAdminWa').value||'').trim(); return busy(el, async()=>{ if(await call('admin_set_setting', {p_key:'admin_whatsapp', p_value:v}, v?'Admin number saved.':'Admin number removed.')) loadSettings(); }); }
  if(a==='copygroup'){ const fams=(ADM.data.families||[]).filter(f=>f.wants_group && !f.blocked && f.whatsapp && (!ADM.fc||f.country===ADM.fc) && (!ADM.fr||f.region===ADM.fr));
    const list=fams.map(f=>`${f.name}: ${f.whatsapp}`).join('\n');
    try{ await navigator.clipboard.writeText(list); toast(`${fams.length} number${fams.length===1?'':'s'} copied`); }catch(e){ ADM.msg=list; renderAdmin(); } return; }
  if(a==='copyphones'){ const s=(ADM.data.schools||[]).find(x=>x.id===el.dataset.sid); const list=(s&&s.teachers||[]).map(t=>`${t.name}: ${t.phone}`).join('\n');
    try{ await navigator.clipboard.writeText(list); toast('Teacher numbers copied'); }catch(e){ ADM.msg=list; renderAdmin(); } }
}

let round=null, dbRef=null, dbState='checking', dlRef=null;
const STANDALONE = (()=>{ try{ return window.self===window.top; }catch(e){ return false; } })();
/* ---------- live results: sent to the organiser's Google Sheet as soon as each level ends ---------- */
// The Google Sheet is now an archive: family results go to the family's account in the database.
const LIVE = { url: '', key: '' };   // was https://script.google.com/macros/s/AKfycbxrjokxVXg0WQwSPfD9SXMqzU-GAGlS_xjYnIwJBwIusW7GEXeBlWbxdD30GxO6cNXKtg/exec
let liveBusy=false, liveState='', liveLast=0;
function livePending(){ return store.sessions.filter(r=>!r.live).length + store.profiles.filter(p=>p.dirty).length + (store.removed||[]).length; }
async function liveSync(){
  if(!LIVE.url || !STANDALONE || liveBusy) return;
  if(navigator.onLine===false){ liveState='offline'; return; }
  liveBusy=true;
  try{
    for(let guard=0; guard<20; guard++){
      const kids=store.profiles.filter(p=>p.dirty), gone=(store.removed||[]).slice(0,20), rounds=store.sessions.filter(r=>!r.live).slice(0,50);
      if(!kids.length && !gone.length && !rounds.length) break;
      const body={ key:LIVE.key, family:store.family||'', device:store.device,
        children: kids.map(p=>({child_id:p.id, child:p.name, age:p.age, stars:starTotal(p)})).concat(gone),
        rounds: rounds.map(({items,synced,live,...r})=>r) };
      await fetch(LIVE.url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
      kids.forEach(p=>delete p.dirty); rounds.forEach(r=>r.live=true); store.removed=(store.removed||[]).slice(gone.length);
      liveLast=Date.now(); liveState='ok'; save();
    }
  }catch(e){ liveState='offline'; }
  finally{ liveBusy=false; if(current==='sParent') renderParent(); }
}
window.addEventListener('online', ()=>liveSync());
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') liveSync(); });
setInterval(()=>{ if(livePending()) liveSync(); }, 60000);
const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v||'');
function logRound(completed){
  if(!round||round.logged||!me) return;
  round.logged=true;
  const items=round.items; if(!items.length){ round=null; return; }
  const d=new Date(round.started), right=items.filter(i=>i.ok && !i.hint).length;   // an answer found after a hint is not counted as right first time
  const rec={
    id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    date:`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`, time:`${pad2(d.getHours())}:${pad2(d.getMinutes())}`,
    child:me.name, child_age:me.age, child_id:me.id, age_group:GROUPS[bandOf(me)].label.replace('Ages ','').replace('–','-'),
    game:GAMES[round.game].name, game_id:round.game, level:round.level,
    questions:items.length, right_first_try:right, wrong_tries:items.reduce((a,i)=>a+i.wrong,0), answers_shown:items.filter(i=>i.shown).length,
    stars:round.stars||0, passed:!!round.passed, seconds:Math.round((Date.now()-round.started)/1000), completed:!!completed,
    sprint_score: round.game==='sprint'?right:null, device:store.device,
    hints_used: items.filter(i=>i.hint).length, stars_spent: round.spent||0, items, synced:false
  };
  if(SCH.cls){ schoolRound(rec); round=null; return; }      // school children are saved to the school database, not this device's log
  store.sessions.push(rec); if(store.sessions.length>1500) store.sessions=store.sessions.slice(-1500);
  me.dirty=true; famRound(rec); save(); round=null; syncPending();
}
let syncing=false;
async function syncPending(){
  if(!dbRef||syncing) return; syncing=true;
  try{ for(const rec of store.sessions.filter(r=>!r.synced).slice(0,40)){ const {synced,...data}=rec;
      try{ await dbRef.collection('sessions').doc(rec.id).set(data); rec.synced=true; save(); }
      catch(e){ dbState=(e&&/permission|not_granted|denied|auth/i.test(e.code||''))?'denied':'error'; break; } }
  } finally { syncing=false; if(current==='sParent') renderParent(); }
}
(async()=>{ try{ if(!window.claude||!window.claude.use){ dbState='off'; return; }
  const [db,dl]=await Promise.all([claude.use('db'),claude.use('downloads')]); dbRef=db; dlRef=dl; dbState=db?'on':'off';
  if(current==='sParent') renderParent(); syncPending(); }catch(e){ dbState='off'; } })();
const CSV_COLS=['id','date','time','child','child_age','age_group','game','level','questions','right_first_try','wrong_tries','answers_shown','hints_used','stars','passed','seconds','completed','sprint_score','device'];
function toCSV(){ const q=v=>{ if(v===null||v===undefined) return ''; const s=String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  return [CSV_COLS.join(',')].concat(store.sessions.map(r=>CSV_COLS.map(c=>q(r[c])).join(','))).join('\n'); }
function totals(p){ const rs=store.sessions.filter(r=>r.child_id===p.id); return {rounds:rs.length, answers:rs.reduce((a,r)=>a+r.questions,0), right:rs.reduce((a,r)=>a+r.right_first_try,0), wrong:rs.reduce((a,r)=>a+r.wrong_tries,0)}; }
const canEmail = () => STANDALONE && validEmail(store.sendTo);
const canShare = () => STANDALONE && !!navigator.share;
function sendHelp(){
  if(canEmail()) return `Tap <b>Email results</b> to send them to ${esc(store.sendTo)}${canShare()?', or <b>Send results</b> to choose WhatsApp or another app':''}.`;
  if(canShare()) return 'Tap <b>Send results</b> and choose Gmail or WhatsApp.';
  return 'Tap <b>Copy results message</b> and paste it into an email or WhatsApp message.';
}
function csvName(){ const d=new Date(); return `garaad-${store.device}-${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}.csv`; }
function summaryText(){ return resultsMessage().split('\n--- Spreadsheet data')[0].trim(); }
async function shareResults(){

/* ---------- play ---------- */
/* Each question is built from a seed, so a question the child missed can be asked again exactly. */
let plan=[];
function makeQ(gid, lv, seed){
  const sd = seed==null ? (Math.random()*4294967296)>>>0 : seed;
  _seed = sd; const qq = GAMES[gid].make(lv); qq.gid=gid; qq.level=lv; qq.seed=sd; return qq;
}
const REVIEW_GAP = 3*60*1000;   // a missed question comes back after a few minutes, not straight away
function addReview(qq){
  if(!me||!qq||!qq.gid) return; me.review=me.review||[];
  const r=me.review.find(x=>x.g===qq.gid&&x.s===qq.seed);
  if(r){ r.n++; r.t=Date.now(); } else { me.review.push({g:qq.gid, lv:qq.level, s:qq.seed, n:1, t:Date.now()}); if(me.review.length>40) me.review.shift(); }
}
function clearReview(qq){ if(me&&me.review) me.review=me.review.filter(x=>!(x.g===qq.gid&&x.s===qq.seed)); }
function dueReviews(gid){ const ok=new Set(G().games); return (me.review||[]).filter(r=>ok.has(r.g) && (!gid||r.g===gid) && Date.now()-r.t>=REVIEW_GAP); }
function buildPlan(gid, lv){
  if(gid==='review') return dueReviews().sort((x,y)=>y.n-x.n||x.t-y.t).slice(0,6).map(r=>({g:r.g,lv:r.lv,s:r.s,review:true}));
  const N=G().perLevel, out=Array.from({length:N},()=>({g:gid,lv}));
  const due=dueReviews(gid).filter(r=>r.lv<=lv).slice(0, N>=8?2:1);
  const spots=[...Array(N-1).keys()].map(i=>i+1).sort(()=>Math.random()-.5);   // never the first question
  due.forEach((r,i)=>{ out[spots[i]]={g:r.g,lv:r.lv,s:r.s,review:true}; });
  return out;
}

const todayStr = () => dayStr(new Date());
function practiceDays(p){
  const days=new Set(p.practiceDays||[]), d=new Date(); let n=0;
  if(!days.has(dayStr(d))) d.setDate(d.getDate()-1);
  while(days.has(dayStr(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function buildPractice(){
  const ids=(G().practiceGames||G().games).filter(id=>!GAMES[id].isSprint);
  const st=ids.map(id=>{ const g=gp(me,id); return {id, acc:g.tries>=3?g.right/g.tries:null, done:levelsDone(g), last:g.last||0}; });
  const used=new Set(), steps=[];
  if(dueReviews().length) steps.push({g:'review', lv:0});
  const take = x => { if(x && !used.has(x.id)){ used.add(x.id); steps.push({g:x.id, lv:Math.min(capOf(x.id), gp(me,x.id).unlocked)}); } };
  take(st.filter(x=>x.acc!==null && x.acc<0.75).sort((x,y)=>x.acc-y.acc)[0]);                       // the one that needs practice
  take(st.filter(x=>!used.has(x.id) && x.done<capOf(x.id)).sort((x,y)=>x.last-y.last)[0]);         // keep moving forward, least recently played first
  take(st.filter(x=>!used.has(x.id) && x.acc!==null && x.acc>=0.75).sort((x,y)=>y.last-x.last)[0]); // one they enjoy and are good at
  for(const x of st.slice().sort(()=>Math.random()-.5)){ if(steps.filter(z=>z.g!=='review').length>=3) break; take(x); }
  return steps;
}
function startPractice(){ practice={steps:buildPractice(), i:0}; runPracticeStep(); }
function runPracticeStep(){ const stp=practice.steps[practice.i]; game=stp.g; startLevel(stp.lv); }

function startLevel(n){
  logRound(false);
  level=n; qi=0;
  round={game, level:n, started:Date.now(), items:[], logged:false};
  me.last=Date.now(); save();
  show('sPlay');
  const g0=GAMES[game];
  const label = g0.isSprint||g0.isReview ? g0.name : `${g0.name} · Level ${n}`;
  $('pTitle').textContent = practice ? `Practice ${practice.i+1} of ${practice.steps.length} · ${label}` : label;
  if(g0.isSprint){ startSprint(); return; }
  plan=buildPlan(game,n);
  if(!plan.length){ practice ? nextPracticeOrEnd() : openGames(); return; }
  setBar(); nextQ();
}
function setBar(){ $('qbar').style.width = `${100*qi/Math.max(1,plan.length)}%`; }
function nextQ(){
  if(qi>=plan.length){ finishLevel(); return; }
  const sp=plan[qi];
  if(sp.s!=null) q=makeQ(sp.g, sp.lv, sp.s);
  else { let g=0; do{ q=makeQ(sp.g, sp.lv); }while(!q.pad && q.answer===lastAnswer && g++<8); }
  q.isReview=!!sp.review; lastAnswer=q.answer; renderQ();
  if(G().voice){ const myQ=q; setTimeout(async()=>{ if(q.pre){ await q.pre(); if(q!==myQ) return; } say(q.isReview?['Here is one to try again.', ...questionParts(q)]:questionParts(q)); },250); }
}
function renderQ(){
  $('pText').textContent=q.text;
  $('stage').innerHTML = (q.isReview?'<div class="revtag">🔁 One to try again</div>':'') + q.html + (q.pad ? padHTML(q.decimal) : '');
  typed=''; tries=0; locked=false;
  if(q.mount) q.mount($('stage'));
  setOwl('think'); renderHint();
}
/* the owl beside the question: thinking, cheering on a right answer, a gentle "try again" face on a wrong one */
let owlT=null;
function setOwl(mood, back){
  const el=$('pOwl'); if(!el) return;
  clearTimeout(owlT); el.innerHTML=owlSVG(mood); el.classList.remove('bounce');
  if(mood==='cheer'){ void el.offsetWidth; el.classList.add('bounce'); }
  if(back) owlT=setTimeout(()=>{ if(current==='sPlay' && !locked) el.innerHTML=owlSVG('think'); }, back);
}
/* hints bought with stars: tap choices lose some wrong answers; typed answers get a worked first step */
function hintKind(){
  if(!q || placing || sprint || q.seq) return null;
  if(q.pad) return (q.hint||maskHint(q)) ? 'pad' : null;
  const opts=[...$('stage').querySelectorAll('[data-choice]')];
  return opts.length>=3 && opts.some(b=>b.dataset.choice===q.answer) ? 'choice' : null;
}
function renderHint(){
  const row=$('hintRow'); if(!row) return;
  const kind=hintKind();
  if(!kind || !me){ row.innerHTML=''; return; }
  if(q.hinted){ row.innerHTML=`<p class="hintnote">Hint used${kind==='choice'?' · some wrong answers removed':''}</p>`; return; }
  const free=SCH.preview, ok=free || starBalance(me)>=HINT_COST;
  row.innerHTML=`<button class="hintbtn" id="hintBtn" ${ok?'':'disabled'} aria-label="${ok?`Get a hint for ${HINT_COST} stars`:`A hint needs ${HINT_COST} stars`}"><svg class="bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>${ok?'Get a hint':'Hint'}<span class="cost">${free?'free':HINT_COST}${free?'':ICON_STAR}</span></button>`;
}
function useHint(){
  const kind=hintKind();
  if(!kind || q.hinted || locked) return;
  if(!SCH.preview){ if(starBalance(me)<HINT_COST) return; me.spent=(me.spent||0)+HINT_COST; if(round) round.spent=(round.spent||0)+HINT_COST; }
  q.hinted=true; save();
  if(kind==='choice'){
    const wrong=shuffle([...$('stage').querySelectorAll('[data-choice]')].filter(b=>b.dataset.choice!==q.answer && !b.classList.contains('wrong')));
    wrong.slice(0, Math.max(1, wrong.length-1)).forEach(b=>{ b.classList.add('hinted'); b.setAttribute('aria-disabled','true'); });
    setOwl('happy');
    say(wrong.length>1?'Let me help. Some answers are gone. Look again.':'Let me help. One answer is gone. Look again.');
  } else {
    const h=q.hint||maskHint(q); if(h){ showWhy(h.html); say(['Here is a hint.', h.say]); }
    setOwl('happy');
  }
  renderHint(); renderChip();
}
function showWhy(html){
  const st=$('stage'); let w=st.querySelector('.why');
  if(!w){ w=document.createElement('div'); w.className='why'; const tag=st.querySelector('.revtag'); tag?tag.after(w):st.prepend(w); }
  w.innerHTML=html;
}
function padHTML(dec){
  const k=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-key="${n}">${n}</button>`).join('');
  const del=`<button data-key="del" aria-label="Delete"><svg viewBox="0 0 24 24" width="24" height="24" style="stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M9 5h11v14H9l-6-7z"/><path d="M12 9l5 6M17 9l-5 6"/></svg></button>`;
  return dec ? `<div class="pad">${k}<button data-key=".">.</button><button data-key="0">0</button>${del}<button class="go span" data-key="go">Check</button></div>`
             : `<div class="pad">${k}${del}<button data-key="0">0</button><button class="go" data-key="go" aria-label="Check">✓</button></div>`;
}
function updateSlot(){ const s=$('slot'); if(!s) return; s.textContent=typed||'?'; s.classList.toggle('empty',!typed); }
function onKey(k){
  if(locked) return; audio();
  if(k==='del'){ typed=typed.slice(0,-1); updateSlot(); return; }
  if(k==='go'){ if(typed&&typed!=='.') submitTyped(); return; }
  if(k==='.'&&typed.includes('.')) return;
  if(typed.length>=7) return;
  typed+=k; updateSlot(); tick();
  if(sprint && typed.length>=q.answer.length) setTimeout(()=>{ if(sprint&&typed) submitTyped(); },140);
}
const isRight = () => q.decimal ? Math.abs(parseFloat(typed)-parseFloat(q.answer))<1e-9 : typed.replace(/^0+(?=\d)/,'')===q.answer;
function submitTyped(){
  if(placing){ placeAnswer(isRight()); return; }
  if(sprint){ sprintAnswer(isRight()); return; }
  const s=$('slot');
  if(isRight()){ locked=true; s.classList.add('ok'); ding(); burst(s); celebrateCorrect(); completeQ(tries===0, false, async()=>{ if(G().voice) await say(`Correct! ${speakify(q.explain)}.`); else await wait(700); }); return; }
  tries++; boop(); setOwl('oops', 1600); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); typed=''; setTimeout(updateSlot,300);
  if(tries===1){ const h=q.hint||maskHint(q); if(h){ showWhy(h.html); if(G().voice) say(['Not quite. Here is a hint.', h.say]); return; } }
  if(tries>=2){ locked=true;
    setTimeout(async()=>{ s.textContent=q.answer; s.classList.remove('empty'); s.classList.add('reveal'); $('pText').textContent=q.explain;
      await say(speakify(q.explain)+'.',{silentMs:2400}); await wait(900); completeQ(false,true); },350);
  } else if(G().voice) say('Not quite. Try again.');
}
function onChoice(btn){
  if(locked) return; audio();
  if(placing){ placeAnswer(btn.dataset.choice===q.answer, btn); return; }
  if(q.seq){
    q.pos=q.pos||0;
    if(btn.classList.contains('right')) return;
    if(btn.dataset.choice===q.seq[q.pos]){
      btn.classList.add('right'); btn.insertAdjacentHTML('beforeend',`<span class="stepno">${q.pos+1}</span>`); q.pos++;
      if(q.pos<q.seq.length){ tick(); return; }
      locked=true; ding(); burst(btn); celebrateCorrect(); completeQ(tries===0,false,q.seqDone||(()=>say(pick(['Well done! You did it all!','Great listening!','Yes! All done!'])))); return;
    }
    tries++; boop(); btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
    q.pos=0; $('stage').querySelectorAll('.opt.right').forEach(b=>{ b.classList.remove('right'); const n=b.querySelector('.stepno'); if(n) n.remove(); });
    if(tries>=2){ const first=choiceBtn($('stage'),q.seq[0]); if(first) first.classList.add('pulse'); }
    say(q.seqRetry ? (tries>=2?[q.seqRetry,'Start with the one that is shining.']:q.seqRetry) : tries>=2?['Start again. Listen.', q.seqSay, 'Start with the one that is shining.']:['Oops! Start again. Listen.', q.seqSay]);
    return;
  }
  if(btn.dataset.choice===q.answer){ locked=true; btn.classList.add('right'); ding(); burst(btn); celebrateCorrect();
    completeQ(tries===0,false, q.after ? ()=>q.after($('stage')) : ()=>say(`${pick(['Well done!','Great!','Yes!'])} ${q.praise||''}`)); }
  else {
    tries++; btn.classList.add('wrong'); boop(); setOwl('oops', 1600);
    const w = q.why ? q.why($('stage'), btn.dataset.choice, btn) : null;
    if(w && w.html) showWhy(w.html);
    if(tries>=2){ const c=[...$('stage').querySelectorAll('[data-choice]')].find(b=>b.dataset.choice===q.answer); if(c) c.classList.add('pulse'); }
    if(G().voice){ const first=(w&&w.say)||pick(['Try again.','Not that one. Try again.','Almost! Try again.']); say(tries>=2?[first,'Tap the one that is shining.']:first); }
  }
}
function customDone(firstTry, celebrate){ if(locked||!q) return; locked=true; if(firstTry){ ding(); celebrateCorrect(); } else tick(); completeQ(firstTry, false, celebrate||null); }
async function completeQ(firstTry, shown, celebrate){
  if(celebrate) await celebrate();
  const s=gp(me,q.gid); s.tries++; if(firstTry) s.right++; s.last=Date.now();
  if(firstTry){ if(q.isReview) clearReview(q); if(q.word) learnWord(q.word); } else if(!q.noReview) addReview(q);
  if(round) round.items.push({game:q.gid, answer:q.answer, ok:!!firstTry, wrong:tries, shown:!!shown, review:!!q.isReview, hint:!!q.hinted});
  save(); qi++; setBar(); await wait(350); nextQ();
}
function practiceButtons(){
  if(!practice) return null;
  practice.i++;
  if(practice.i<practice.steps.length) return {btns:`<button class="btn primary" id="pracNext">Continue ▶</button>`, note:`<p class="pracnext">Next: ${GAMES[practice.steps[practice.i].g].name}</p>`, say:'Great! On to the next one.'};
  me.practiceDays=[...new Set([...(me.practiceDays||[]), todayStr()])].slice(-90); save(); practice=null;
  const d=practiceDays(me);
  return {btns:`<button class="btn primary" id="pracEnd">Back to games</button>`, note:`<div class="pracdone">🌟 Today's practice is done! · ${d} day${d>1?'s':''} in a row</div>`, say:"Today's practice is done! Great work."};
}
function nextPracticeOrEnd(){ const pb=practiceButtons(); if(pb && practice) runPracticeStep(); else openGames(); }
function cheerLines(passed, stars, lvl){
  const n=me.name;
  if(!passed) return `Good try, ${n}! Every try makes you stronger. Let's play again!`;
  if(stars===3) return pick([`Perfect, ${n}! Three stars! You are making very good progress!`, `Wow, ${n}! All right! You are doing brilliantly!`]);
  return pick([`Well done, ${n}! You are making very good progress!`, `Amazing, ${n}! Level ${lvl} complete. You are doing great!`, `Fantastic work, ${n}! You are getting better and better!`]);
}
function bigCelebration(){ fanfare(); confetti(70); setTimeout(()=>riseStars(24),300); }
function finishLevel(){
  const items=round?round.items:[], per=plan.length, right=items.filter(i=>i.ok).length, ratio=right/per, little=bandOf(me)==='little';
  if(GAMES[game].isReview){
    if(round){ round.stars=0; round.passed=true; } save(); logRound(true);
    const left=per-right, pb=practiceButtons();
    show('sDone'); bigCelebration();
    $('result').innerHTML=`<div class="cele">${mascotSVG('cheer')}</div><h2>Review done, ${esc(me.name)}!</h2><p>${right} of ${per} right first time.${left?` ${left} will come back later.`:' All fixed!'}</p>
      ${pb?pb.note:''}<div class="btns">${pb?pb.btns:'<button class="btn primary" id="levelsBtn">Back to games</button>'}</div>`;
    say(pb?[`Well done, ${me.name}! You fixed ${right} of them.`, pb.say]:`Well done, ${me.name}! You are making very good progress!`);
    return;
  }
  let stars = ratio>=0.99?3 : ratio>=0.7?2 : ratio>=0.5?1 : 0;
  if(little) stars=Math.max(1,stars);
  const cap=capOf(game), passed=stars>=1, s=gp(me,game), before=Math.min(cap,levelsDone(s));
  s.plays++;
  if(passed){ s.stars[level]=Math.max(s.stars[level]||0,stars); if(level===s.unlocked&&level<cap) s.unlocked=level+1; }
  if(round){ round.stars=stars; round.passed=passed; }
  save(); logRound(true);
  show('sDone');
  if(passed) bigCelebration();
  const last=level>=cap, pb=practiceButtons(), after=Math.min(cap,levelsDone(s));
  $('result').innerHTML=`<div class="cele">${mascotSVG(passed?'cheer':'happy')}</div>
    <div class="bigstars">${[1,2,3].map(i=>`<span class="${i<=stars?'on':''}">★</span>`).join('')}</div>
    <h2>${passed?(last?`You finished all ${cap} levels, ${esc(me.name)}!`:(stars===3?`Perfect, ${esc(me.name)}!`:`Well done, ${esc(me.name)}!`)):`Good try, ${esc(me.name)}!`}</h2>
    <p>${passed?`Level ${level} complete · `:''}${right} of ${per} right first time${passed?'':` · get ${Math.ceil(per*.5)} to pass`}</p>
    <div class="gprogline" style="--acc:${GAMES[game].acc}"><span>${GAMES[game].icon} ${GAMES[game].name}</span><span class="bar" style="flex:1"><i id="progFill" style="width:${Math.round(before*100/cap)}%"></i></span><span>${after}/${cap}</span></div>
    ${pb?pb.note:''}
    <div class="btns">${pb?pb.btns:`${passed&&!last?`<button class="btn primary" id="nextBtn">Next level ▶</button>`:''}<button class="btn${passed?'':' primary'}" id="againBtn">↻ Play again</button><button class="btn" id="levelsBtn">All levels</button>`}</div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const f=$('progFill'); if(f) f.style.width=Math.round(after*100/cap)+'%'; }));
  say(pb?[cheerLines(passed,stars,level), pb.say]:cheerLines(passed,stars,level));
}

/* ---------- quick check: find the right games and starting level ---------- */
/* A ladder of skills from counting (3 years) to brackets (12 years). The check starts at the child's age,
   goes up after a right answer and down after a wrong one, and stops after 8 questions. */
const LADDER=[['count',2],['count',6],['addpics',3],['addpics',8],['order',8],['addsub',3],['addsub',5],['place',4],['addsub',8],['times',4],['divide',4],['times',8],['fractions',6],['orderops',4]];
const START_BY_AGE={3:0,4:1,5:2,6:4,7:5,8:7,9:8,10:9,11:10,12:11};
let placing=null;
const gameBand = gid => Object.keys(GROUPS).find(k=>GROUPS[k].games.includes(gid)) || 'little';
function startPlacement(p){
  me=p; practice=null; stopSprint(); logRound(false);
  placing={pos:START_BY_AGE[p.age]??2, n:0, max:8, hist:[]};
  game='placement'; level=0; plan=[];
  round={game:'placement', level:0, started:Date.now(), items:[], logged:false};
  show('sPlay'); $('qbar').style.width='0%';
  say(`Hi ${p.name}! Let's play a few warm-up questions.`).then(()=>{ if(placing) placeQ(); });
  $('pText').textContent='Warm-up'; $('stage').innerHTML=`<div class="cele">${mascotSVG('happy')}</div><p style="font-size:20px;font-weight:600;text-align:center;margin:0">A few warm-up questions<br>to find the best games for you.</p>`;
}
function placeQ(){
  const [gid,lv]=placing.start ? placing.list[placing.n] : LADDER[placing.pos];
  q=makeQ(gid,lv); q.isReview=false; renderQ();
  $('pTitle').textContent=`${placing.start?'Starting exercise':'Warm-up'} · ${placing.n+1} of ${placing.max}`;
  $('qbar').style.width=`${100*placing.n/placing.max}%`;
  if(placing.start){ const myQ=q; setTimeout(async()=>{ if(q.pre){ await q.pre(); if(q!==myQ) return; } say(questionParts(q)); },250); }
  else if(GROUPS[gameBand(gid)].voice || bandOf(me)!=='older') setTimeout(()=>say(questionParts(q)),250);
}
function placeAnswer(ok, btn){
  locked=true;
  const pos=placing.pos;
  placing.hist.push({pos, ok, gid:q.gid}); placing.n++;
  if(round) round.items.push({game:q.gid, answer:q.answer, ok, wrong:ok?0:1, shown:false});
  if(ok){ ding(); if(btn) btn.classList.add('right'); else { const s=$('slot'); if(s) s.classList.add('ok'); } riseStars(8); }
  else tick();
  say(ok?pick(['Great!','Nice!','Yes!']):pick(['Okay! Next one.','Thank you! Next one.']));
  if(placing.start){ setTimeout(()=>{ if(!placing) return; placing.n>=placing.max ? finishStarting() : placeQ(); }, 900); return; }
  const dir=ok?1:-1; if(placing.dir && dir!==placing.dir) placing.reversed=true; placing.dir=dir;
  placing.pos=Math.max(0,Math.min(LADDER.length-1,pos+dir*(placing.reversed?1:2)));   // big steps until the first change of direction
  const topOut = ok && pos===LADDER.length-1 && placing.hist.filter(h=>h.pos===pos&&h.ok).length>=2;
  setTimeout(()=>{ if(!placing) return; (placing.n>=placing.max || topOut) ? finishPlacement() : placeQ(); }, 900);
}
function placementEstimate(hist){
  const by={}; hist.forEach(h=>{ by[h.pos]=by[h.pos]||{ok:0,no:0}; h.ok?by[h.pos].ok++:by[h.pos].no++; });
  const good=Object.keys(by).map(Number).filter(k=>by[k].ok>by[k].no);
  return good.length ? Math.max(...good) : 0;
}
function placementResult(est){
  const band = est<=3?'little' : est<=8?'middle' : 'older';
  const start = band==='little' ? (est<=1?1:est===2?3:5) : band==='middle' ? (est<=5?1:est<=7?3:5) : (est<=10?1:est<=12?3:5);
  return {band, start};
}
function finishPlacement(){
  const p=me, est=placementEstimate(placing.hist), r=placementResult(est); placing=null;
  p.band=r.band; p.placement={est, band:r.band, start:r.start, at:Date.now()}; p.dirty=true;
  GROUPS[r.band].games.forEach(id=>{ if(GAMES[id].isSprint) return; const g=gp(p,id); g.unlocked=Math.max(g.unlocked||1, r.start); });
  if(round){ round.level=est+1; round.stars=0; round.passed=true; }
  save(); logRound(true);
  show('sDone'); bigCelebration();
  $('result').innerHTML=`<div class="cele">${mascotSVG('cheer')}</div><h2>All done, ${esc(p.name)}!</h2><p>Your games are ready.</p>
    <div class="placednote">For grown-ups: ${esc(p.name)} will play the <b>${GROUPS[r.band].label.replace('Ages','ages')}</b> games, starting at <b>level ${r.start}</b>. You can change this in the Parent area.</div>
    <div class="btns"><button class="btn primary" id="placedGo">Let's play ▶</button></div>`;
  say(`Great job, ${p.name}! Your games are ready. Let's play!`);
}

/* ---------- 60-second challenge ---------- */
function startSprint(){
  sprint={score:0,end:Date.now()+60000,timer:null};
  if(G().voice) say('Ready, set, go!');
  sprintQ(); sprintTick(); sprint.timer=setInterval(sprintTick,250);
}
function sprintQ(){
  const pool=G().games.filter(id=>GAMES[id].sprint), id=pick(pool), s=gp(me,id);
  q=makeQ(id, Math.max(1,Math.min(10,s.unlocked))); renderQ();
}
function sprintTick(){
  if(!sprint) return;
  const left=Math.max(0,sprint.end-Date.now());
  $('qbar').style.width=(left/600)+'%';
  $('pText').textContent=`${Math.ceil(left/1000)} s left · ${sprint.score} correct`;
  if(left<=0) endSprint();
}
function sprintAnswer(ok){
  const s=$('slot'); if(round) round.items.push({game:q.gid, answer:q.answer, ok:!!ok, wrong:ok?0:1, shown:!ok}); if(!ok) addReview(q);
  locked=true;
  if(ok){ sprint.score++; tick(); s.classList.add('ok'); setTimeout(()=>{ if(sprint) sprintQ(); },220); }
  else { boop(); s.textContent=q.answer; s.classList.add('reveal'); setTimeout(()=>{ if(sprint) sprintQ(); },900); }
  sprintTick();
}
function stopSprint(){ if(sprint){ clearInterval(sprint.timer); sprint=null; } }
function endSprint(){
  const score=sprint.score; stopSprint();
  const prev=me.best.sprint||0, best=score>prev; if(best) me.best.sprint=score;
  const bonus=Math.min(3,Math.floor(score/5)); me.bonus=(me.bonus||0)+bonus;
  if(round){ round.stars=bonus; round.passed=true; } save(); logRound(true);
  show('sDone'); fanfare();
  $('result').innerHTML=`<div class="bigemoji">${best?'🏆':'⏱️'}</div><h2>${score} correct</h2><p>${best?'New personal best!':`Your best is ${prev}.`}${bonus?` +${bonus} ★`:''}</p>
    <div class="btns"><button class="btn primary" id="againBtn">↻ Play again</button><button class="btn" id="levelsBtn">All games</button></div>`;
  if(G().voice) say(best?`New best! ${score} correct!`:`${score} correct.`);
}

/* ---------- parent area ---------- */

/* ---------- new home: garaad.app ----------
   The same page runs at the old address (amousamf.github.io/Tiri) and at garaad.app.
   Browser storage belongs to one address, so the old address packs the phone's games into the
   link (after #, which never leaves the phone) and opens garaad.app, which unpacks and keeps them.
   The old copy is left as it was; from then on the old address just forwards.
   Nothing happens until garaad.app answers move.json, so this is safe to publish early. */
const DEVTEST = location.hostname==='localhost' || location.hostname==='127.0.0.1';
const QS = new URLSearchParams(location.search);
const NEW_HOME = (DEVTEST && QS.get('newhome')) || 'https://garaad.app/';
const OLD_HOME_URL = (DEVTEST && QS.get('oldurl')) || 'https://amousamf.github.io/Tiri/';
const AT_OLD_HOME = /^amousamf\.github\.io$/i.test(location.hostname) || (DEVTEST && QS.get('oldhome')==='1');
const fwdSearch = () => { const p=new URLSearchParams(location.search); p.delete('newhome'); p.delete('oldhome'); const s=p.toString(); return s?'?'+s:''; };
const toB64u = bytes => { let s=''; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const fromB64u = str => { const s=atob(str.replace(/-/g,'+').replace(/_/g,'/')); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b; };
async function packMove(obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream==='function'){
    try{ const z = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()); return 'z.'+toB64u(z); }catch(e){}
  }
  return 'j.'+toB64u(raw);
}
async function unpackMove(str){
  const kind=str.slice(0,2), bytes=fromB64u(str.slice(2));
  let raw;
  if(kind==='z.') raw = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  else if(kind==='j.') raw = bytes;
  else throw new Error('bad_move');
  const obj = JSON.parse(new TextDecoder().decode(raw));
  if(!obj || typeof obj!=='object' || !obj.store || typeof obj.store!=='object') throw new Error('bad_move');
  return obj;
}
const hasData = s => !!(s && ((Array.isArray(s.profiles) && s.profiles.length) || s.school || (Array.isArray(s.sessions) && s.sessions.length)));
function mergeMove(cur, inc){
  inc = Object.assign({}, inc); delete inc.movedTo;
  if(!hasData(cur)) return inc;                       // usual case: nothing here yet
  const out = Object.assign({}, cur);
  const ids = a => new Set((a||[]).map(x=>x && x.id));
  const have = ids(out.profiles), seen = ids(out.sessions);
  out.profiles = (out.profiles||[]).concat((inc.profiles||[]).filter(p=>p && !have.has(p.id)));
  out.sessions = (out.sessions||[]).concat((inc.sessions||[]).filter(r=>r && !seen.has(r.id)));
  if(!out.school && inc.school) out.school = inc.school;
  else if(out.school && inc.school){ out.school = Object.assign({}, inc.school, out.school); out.school.outbox = (inc.school.outbox||[]).concat(out.school.outbox||[]); }
  for(const k of Object.keys(inc)) if(out[k]===undefined) out[k]=inc[k];
  delete out.movedTo;
  return out;
}
function moveScreen(msg){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#FFF7E8;color:#2B2118;font:600 20px/1.4 system-ui,sans-serif';
  d.innerHTML='<svg width="96" height="96" viewBox="0 0 100 100" aria-hidden="true"><path d="M14 8 L34 24 Q50 17 66 24 L86 8 Q95 40 91 62 Q85 93 50 95 Q15 93 9 62 Q5 40 14 8 Z" fill="#0E8C7E"/><circle cx="35" cy="53" r="11" fill="#fff"/><circle cx="65" cy="53" r="11" fill="#fff"/><circle cx="36" cy="54" r="5" fill="#0A5E55"/><circle cx="66" cy="54" r="5" fill="#0A5E55"/><polygon points="46,63 54,63 50,70" fill="#F5B400"/></svg><div></div>';
  d.lastChild.textContent=msg; document.body.appendChild(d); return d;
}
async function newHomeReady(){
  try{
    const ctl = ('AbortController' in window) ? new AbortController() : null;
    const t = setTimeout(()=>ctl && ctl.abort(), 5000);
    const r = await fetch(NEW_HOME+'move.json?t='+Date.now(), {cache:'no-store', signal: ctl && ctl.signal});
    clearTimeout(t);
    return r.ok && (await r.json()).accept===1;
  }catch(e){ return false; }
}
async function moveOut(){                            // at the old address; true = leaving
  let s=null; try{ s=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  const again = location.hash==='#again';              // garaad.app asks for the games once more
  if(s && s.movedTo && !again){
    if(navigator.onLine===false){ moveScreen('Tiri is now Garaad. Connect to the internet once to open it.'); return true; }
    location.replace(NEW_HOME+fwdSearch()); return true;
  }
  if(!(await newHomeReady())) return false;          // not live yet, or offline: keep playing here
  if(!hasData(s)){ location.replace(NEW_HOME+fwdSearch()); return true; }
  const pack = Object.assign({}, s); delete pack.movedTo;
  // finished results don't need their question lists on the trip
  pack.sessions = (s.sessions||[]).map(r=> (r && r.live) ? Object.assign({}, r, {items:undefined}) : r);
  let muted=null; try{ muted=localStorage.getItem('cwm.muted'); }catch(e){}
  let data = await packMove({v:1, store:pack, muted});
  if(data.length > 1500000){                          // very long history: keep everything not yet sent + the last 300 sent
    const sent = pack.sessions.filter(r=>r && r.live);
    pack.sessions = pack.sessions.filter(r=>r && !r.live).concat(sent.slice(-300));
    data = await packMove({v:1, store:pack, muted});
  }
  s.movedTo = NEW_HOME; s.movedAt = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){}
  moveScreen('Tiri is moving to its new home, Garaad…');
  setTimeout(()=>location.replace(NEW_HOME+fwdSearch()+'#move='+data), 600);
  return true;
}
async function moveIn(){                              // at garaad.app, arriving with a phone's games
  const m = location.hash.match(/^#move=(.+)$/); if(!m) return null;
  try{ history.replaceState(null, '', location.pathname+location.search); }catch(e){}
  try{
    const inc = await unpackMove(m[1]);
    let cur=null; try{ cur=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
    localStorage.setItem(KEY, JSON.stringify(mergeMove(cur, inc.store)));
    if(inc.muted==='1'||inc.muted==='0'){ localStorage.setItem('cwm.muted', inc.muted); muted = inc.muted==='1'; }
    return 'ok';
  }catch(e){ return 'failed'; }
}
window.__move={packMove,unpackMove,mergeMove};
if(DEVTEST) window.__t={get store(){ return store; }, get me(){ return me; }, set me(v){ me=v; }, gp, logRound, pickTheme, goHome, openParent, openEditor, setRound:r=>{ round=r; }};   // test hooks, only on this computer

(async ()=>{
  if(AT_OLD_HOME){ try{ if(await moveOut()) return; }catch(e){} }
  const moved = AT_OLD_HOME ? null : await moveIn();
  load(); renderMute();
  if(store.mode==='school') openSchoolHome(); else { renderHome(); show('sHome'); }
  if(!store.splashSeen && !store.mode && !store.profiles.length) showSplash(0);   // new phones only
  if(moved==='ok' && hasData(store)) toast('Welcome to Garaad! Your games came with you.');
  if(moved==='failed'){                               // ask the old address once more (once per tab)
    let tried=false; try{ tried=sessionStorage.getItem('garaad.moveRetry')==='1'; sessionStorage.setItem('garaad.moveRetry','1'); }catch(e){ tried=true; }
    if(!tried && !hasData(store)){ location.replace(OLD_HOME_URL+fwdSearch()+'#again'); return; }
    toast('Your games did not come over. Ask for help, they are still safe at the old link.');
  }
  setTimeout(liveSync, 1500);
  setTimeout(loadSettings, 2500);
  setTimeout(obFlush, 2000);
})();
})();
