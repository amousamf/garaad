<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

.readcard{max-width:560px;margin:0 12px;padding:14px 20px;border-radius:18px;background:var(--surface);border:2px solid var(--line);font-size:clamp(24px,6.4vw,34px);font-weight:700;text-align:center;line-height:1.3}
.readcard.story{font-size:clamp(18px,4.8vw,23px);font-weight:600;text-align:left}
.readq{font-size:clamp(17px,4.6vw,21px);font-weight:700;color:var(--primary);text-align:center;padding:0 12px}
.opt.sent{width:min(560px,calc(100vw - 32px));min-height:58px;padding:10px 16px;font:inherit;font-size:clamp(17px,4.6vw,21px);font-weight:600;text-align:left;justify-items:start;color:var(--ink)}
.opt.tile{min-width:60px;height:56px;padding:0 14px;font:inherit;font-size:clamp(19px,5.2vw,24px);font-weight:700;color:var(--ink)}
.opt.yn{min-width:clamp(120px,36vw,170px);height:clamp(70px,17vw,88px);font:inherit;font-size:clamp(22px,6vw,28px);font-weight:700;color:var(--ink)}
.opt.letter{width:clamp(70px,19vw,92px);aspect-ratio:1/1;font:inherit;font-size:clamp(34px,9vw,46px);font-weight:700;color:var(--ink)}
.opt.letter.multi{font-size:clamp(26px,7vw,36px)}
.opt.capt{flex:1 1 140px;min-height:92px;max-width:300px;font-size:clamp(24px,6.5vw,34px)}
.opt.shapes2 svg{width:44px;height:44px}
.bigletter{font-size:clamp(70px,20vw,110px);font-weight:700;line-height:1;color:var(--primary);background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:6px 24px}
.spellword{font-size:clamp(34px,9vw,48px);font-weight:700;letter-spacing:.06em}
.spellword .gap{display:inline-block;min-width:1em;border-bottom:4px solid var(--primary);color:var(--primary);text-align:center;margin:0 2px}
.spellword .gap.done{color:var(--success);border-color:var(--success)}
.slots,.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px;padding:0 10px}
.slotL{width:48px;height:56px;border:0;border-bottom:4px solid var(--primary);background:var(--surface);border-radius:10px 10px 4px 4px;font:inherit;font-size:30px;font-weight:700;color:var(--ink);position:relative}
.slots.long{gap:4px;padding:0}.slots.long .slotL{width:31px;height:46px;font-size:23px}
.slotL[data-hint]:empty::after{content:attr(data-hint);color:#C5CBE0}
.slotL.ok{border-color:var(--success);background:var(--success-soft)}.slotL.bad{border-color:var(--danger);background:var(--danger-soft);animation:shake .45s}
.tileL{width:50px;height:54px;border-radius:12px;border:2px solid var(--line);background:#FFF6DB;box-shadow:0 3px 0 #E8D59B;font:inherit;font-size:28px;font-weight:700;color:var(--ink)}
.bee{font-size:56px;line-height:1}
.beeword{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 10px}
.beeword span{width:34px;height:46px;border-bottom:3px solid var(--line);font-size:28px;font-weight:700;display:grid;place-items:center}
.beeword span.f{border-color:var(--primary)}.beeword span.ok{border-color:var(--success);color:var(--success)}
.beeword.shake{animation:shake .45s}
.kb{display:flex;flex-direction:column;gap:6px;width:100%;max-width:560px;box-sizing:border-box;padding:0 4px}
.kbr{display:flex;gap:3px;justify-content:center}
.kbr button{flex:1;max-width:48px;height:48px;border-radius:9px;border:1px solid var(--line);background:var(--surface);box-shadow:0 2px 0 var(--line);font:inherit;font-size:20px;font-weight:600;color:var(--ink);padding:0;min-width:0}
.kbr .kdel{max-width:64px;flex:1.5}.kbr .kgo{max-width:220px;background:var(--primary);color:#fff;border-color:var(--primary)}
.trace canvas{touch-action:none;background:#fff;border:2px solid var(--line);border-radius:18px;display:block}
/* ---------- English ---------- */
.subjtabs{display:flex;gap:8px;margin:-4px 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px;width:max-content;max-width:100%}
.subjtabs button{border:0;background:transparent;font:inherit;font-weight:700;font-size:16px;padding:9px 18px;border-radius:99px;color:var(--muted);cursor:pointer}
.subjtabs button.on{background:var(--primary);color:#fff}
.stephead{grid-column:1/-1;font-size:17px;margin:10px 2px 0;color:var(--ink)}
.skill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:color-mix(in srgb, var(--acc) 14%, #fff);color:var(--acc);margin-right:2px}
.card.garden .pi{background:#E6F6EC}
.opt.shake{animation:shake .45s}
.opt.pic .sz{display:inline-block;line-height:1}
.opt .sz.big{font-size:1.25em}.opt .sz.small{font-size:.6em}
.opt.shape .sz{display:grid;place-items:center;width:100%}.opt.shape .sz.big svg{width:86%}.opt.shape .sz.small svg{width:44%}
.opt.named{padding-bottom:18px}
.stepno{position:absolute;top:4px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--success);color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center}
.target{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 22px;border-radius:20px;background:var(--surface);border:2px dashed var(--line)}
.target .te{font-size:clamp(52px,14vw,72px);line-height:1.1}
.target .tw{font-size:clamp(20px,5.5vw,26px);font-weight:700;letter-spacing:.02em}
.target .sy{padding:0 3px;border-radius:6px;transition:background .2s}.target .sy+.sy{border-left:2px dotted var(--muted)}
.target .sy.lit{background:#FFE7A3}
.sylls{display:flex;gap:6px;font-size:22px;font-weight:700}.sylls span{background:#fff;border:1.5px solid #F2D27A;border-radius:10px;padding:2px 10px}
.opt.claps{min-width:clamp(70px,19vw,96px);height:clamp(78px,19vw,96px);padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.opt.claps .cl{font-size:clamp(14px,3.8vw,19px);line-height:1.15;max-width:76px;text-align:center}
.opt.claps b{font-size:clamp(20px,5vw,26px)}
.pond{background:linear-gradient(#DDF1FB,#BFE3F5);border-radius:22px;padding:12px 10px}
.opt.fishy{border-radius:50% 50% 46% 46%}
.opt.scenebtn{width:clamp(118px,30vw,136px);aspect-ratio:1/1;padding:0;overflow:hidden}
.scene{position:relative;width:108px;height:108px;display:block}
.scene .thing{position:absolute;font-size:30px;line-height:1;transform:translateX(-50%);z-index:2}
.scene.t-table .furn{position:absolute;left:34px;width:66px;top:54px;height:7px;background:#9A5B2E;border-radius:4px}
.scene.t-table .furn::before,.scene.t-table .furn::after{content:"";position:absolute;top:7px;width:6px;height:36px;background:#9A5B2E;border-radius:3px}
.scene.t-table .furn::before{left:4px}.scene.t-table .furn::after{right:4px}
.scene.t-table.p-on .thing{left:67px;top:24px}.scene.t-table.p-under .thing{left:67px;top:64px}.scene.t-table.p-nextto .thing{left:17px;top:66px}
.scene.t-box .furn{position:absolute;left:36px;width:60px;top:52px;height:44px;background:#B8742F;border-radius:4px 4px 6px 6px;z-index:1}
.scene.t-box .boxfront{position:absolute;left:36px;width:60px;top:62px;height:34px;background:#E0A15A;border-radius:2px 2px 6px 6px;z-index:3;border-top:3px solid #C98A43}
.scene.t-box.p-in .thing{left:66px;top:45px}.scene.t-box.p-on .thing{left:66px;top:19px}.scene.t-box.p-nextto .thing{left:17px;top:66px}
.scene.t-box.p-behind .thing{left:84px;top:28px;z-index:0}
.parrot{display:flex;align-items:flex-end;gap:10px}.pbird{font-size:clamp(56px,15vw,80px);line-height:1;transform-origin:bottom center}
.pbird.talk{animation:pecks .3s ease-in-out infinite alternate}@keyframes pecks{to{transform:rotate(-12deg) scale(1.06)}}
.ppic{font-size:clamp(44px,12vw,64px);line-height:1;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 12px}
.pword{font-size:clamp(22px,6vw,32px);font-weight:700;text-align:center;max-width:560px;padding:0 12px}
.micbtn{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;font:inherit;cursor:pointer;color:var(--ink)}
.micbtn .mi{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:var(--primary);box-shadow:0 4px 0 color-mix(in srgb, var(--primary) 60%, #000)}
.micbtn .ml{font-weight:700;font-size:16px}
.micbtn.on .mi{background:#E0567A;animation:pulse 1s ease-in-out infinite}
.nbig{font-size:clamp(80px,24vw,120px)!important}
.heard{margin:0;min-height:1.4em;font-weight:600;color:var(--muted);text-align:center;padding:0 12px}
.bed{margin-bottom:12px}.bed h3{display:flex;justify-content:space-between;margin:0 0 8px;font-size:17px}.bed h3 span{color:var(--muted);font-weight:600;font-size:14px}
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.plot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;padding:6px 2px;min-height:72px;font:inherit}
.plot.grown{background:#EAF7EF;border:1.5px solid #9ED7B4;cursor:pointer}.plot.seed{background:#F4F1EA;border:1.5px dashed #D9D2C2;opacity:.7}
.plot .pe{font-size:30px;line-height:1.1}.plot .pw{font-size:12px;font-weight:700;color:var(--ink);text-align:center;line-height:1.1}
.plot.pop{animation:pop .35s ease-out}
</style>

<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — top bar, one screen at a time (family → games → levels → play → result).
   Lexend was designed to make reading easier, which suits early readers. One calm light theme; colour comes from each game's accent. */
:root{
  --bg:#F3F5FA;
  --surface:#FFFFFF;
  --ink:#172041;
  --muted:#5B6483;
  --line:#DFE4EE;
  --primary:#3657E0;
  --primary-soft:#E8EDFD;
  --success:#22955A;
  --success-soft:#DFF5E9;
  --danger:#D63E55;
  --danger-soft:#FCE6EA;
  --gold:#F5B922;
  --font:"Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px;box-sizing:border-box}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}

/* top bar */
.top{display:flex;align-items:center;gap:10px;min-height:52px;padding-bottom:6px}
.top .grow{flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px}
.brand .mark{min-width:34px;height:34px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:.5px}
.ibtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:20px;flex:none}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.childchip{display:flex;align-items:center;gap:8px;min-width:0}
.childchip b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.childchip .starcount{font-size:15px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex:none}
.av.lg{width:64px;height:64px;font-size:26px}

.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.head{display:flex;flex-direction:column;gap:4px;margin:6px 0 16px}
.head h1{font-size:clamp(24px,5.5vw,32px);font-weight:700}
.head p{margin:0;color:var(--muted);font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(23,32,65,.04),0 4px 14px rgba(23,32,65,.05)}
.tap{transition:transform .08s, box-shadow .15s, border-color .15s}
.tap:active{transform:scale(.98)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:14px;font-size:16px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.small{height:40px;padding:0 14px;font-size:14px;border-radius:11px}
.btns{display:flex;gap:10px;flex-wrap:wrap}

/* family */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.kid{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 10px 16px;text-align:center;min-width:0}
.kid b{font-size:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kid > span:not(.av):not(.plus){font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.kid.add{border:2px dashed var(--line);background:transparent;box-shadow:none;justify-content:center;color:var(--primary);font-weight:600}
.kid.add .plus{width:64px;height:64px;border-radius:50%;background:var(--primary-soft);display:grid;place-items:center;font-size:30px}
.empty{padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .big{font-size:52px}
.empty p{margin:0;color:var(--muted);max-width:40ch;line-height:1.5}
.aboutlinks{margin:26px auto 8px;text-align:center;font-size:14px;color:var(--muted)}.aboutlinks a{color:inherit;text-decoration:underline;text-underline-offset:3px;padding:8px 6px}
.parentlink{margin:22px auto 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.hold{position:relative;overflow:hidden;isolation:isolate}
.hold .fill{position:absolute;inset:0;background:var(--primary-soft);transform-origin:left;transform:scaleX(0);z-index:-1}
.hold.holding .fill{transition:transform 1.3s linear;transform:scaleX(1)}
.hint{font-size:13px;color:var(--muted);margin:0}

/* form */
.form{padding:20px;display:flex;flex-direction:column;gap:16px;max-width:560px}
.label{font-weight:600;font-size:15px}
.input{font:500 18px var(--font);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box}
.input:focus{border-color:var(--primary);outline:none}
.ages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:360px}
.age{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.age[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.agehint{font-size:14px;color:var(--muted);margin:0}
.err{color:var(--danger);font-weight:600;margin:0}

/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.game{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:14px;text-align:left;min-width:0}
.gicon{grid-row:span 2;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb, var(--acc) 15%, #fff)}
.game b{font-size:16px;font-weight:600;min-width:0}
.game small{font-size:13px;color:var(--muted);line-height:1.3;min-width:0}
.gprog{grid-column:1 / -1;display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc, var(--primary));border-radius:99px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--primary-soft);color:var(--primary)}

/* levels */
.ltop{display:flex;gap:14px;align-items:center;margin:6px 0 18px}
.ltop .gicon{width:60px;height:60px;font-size:32px;grid-row:auto}
.ltop h1{font-size:clamp(22px,5vw,28px)}
.ltop p{margin:2px 0 0;color:var(--muted)}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;max-width:560px}
.lvl{aspect-ratio:1/1;max-width:100%;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:clamp(20px,5vw,26px);font-weight:700;font-variant-numeric:tabular-nums}
.lvl .st{font-size:11px;letter-spacing:1px;color:var(--gold);line-height:1}
.lvl .st .off{color:var(--line)}
.lvl.locked{background:#ECEFF5;color:#A3AAC0;border:1px solid transparent;box-shadow:none;cursor:default}
.lvl.current{border:2px solid var(--acc);box-shadow:0 0 0 4px color-mix(in srgb, var(--acc) 18%, transparent)}
.lvl svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.legend{margin-top:16px;color:var(--muted);font-size:14px;line-height:1.5;max-width:560px}

/* play */
.ptop{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ptop .meta{flex:1;min-width:0}
.ptop .meta b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.qbar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.prompt{display:flex;align-items:center;justify-content:center;gap:12px;min-height:52px;text-align:center}
.prompt .say{width:48px;height:48px;border-radius:50%;background:var(--primary-soft);display:grid;place-items:center;flex:none}
.prompt .say svg{width:24px;height:24px;stroke:var(--primary);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.prompt .text{font-size:clamp(19px,4.6vw,26px);font-weight:600;min-width:0}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vh,26px);min-height:0;overflow-y:auto;padding-block:8px}
.choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:620px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:18px;box-shadow:0 3px 0 var(--line);transition:transform .08s,border-color .15s,background .15s;display:grid;place-items:center}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.num{width:clamp(78px,21vw,104px);aspect-ratio:1/1;font-size:clamp(34px,9vw,48px);font-weight:700;font-variant-numeric:tabular-nums;grid-template-rows:1fr auto;padding:8px 4px}

function tone(f,st,d,type,vol){ const c=audio(); if(!c||muted) return; const o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,c.currentTime+st); g.gain.exponentialRampToValueAtTime(vol||.22,c.currentTime+st+.02); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+st+d); o.connect(g); g.connect(c.destination); o.start(c.currentTime+st); o.stop(c.currentTime+st+d+.05); }

const FEMALE_V=/female|woman|samantha|victoria|karen|moira|tessa|fiona|serena|zira|hazel|susan|heera|catherine|allison|\bava\b|nicky|\bkate\b|libby|sonia|jenny|aria|emma|\bamy\b|joanna|salli|kimberly|\bivy\b|kendra|martha|stephanie|google us english|google uk english female|x-sfg|x-tpf|x-iob|x-iog|x-tpc|x-gba|x-rjs-?f/i;
const MALE_V=/\bmale\b|\bman\b|david|\bmark\b|daniel|\balex\b|\bfred\b|rishi|aaron|arthur|gordon|oliver|thomas|george|\bryan\b|\bguy\b|\beric\b|brian|matthew|joey|justin|x-iol|x-iom|x-tpd|x-gbd|x-gbc|x-rjs\b/i;
let cachedVoice=null, voiceIsFemale=false;
function chooseVoice(){
  try{
    const vs=speechSynthesis.getVoices(); if(!vs.length) return;
    let best=null, bs=-1e9;
    for(const v of vs){
      if(!/^en/i.test(v.lang)) continue;
      let s=0; const nm=v.name+' '+(v.voiceURI||'');
      if(/en[-_](US|GB|AU|IE|ZA|KE|NG)/i.test(v.lang)) s+=2;
      if(FEMALE_V.test(nm)) s+=20; else if(MALE_V.test(nm)) s-=20;
      if(/natural|neural|enhanced|premium|online/i.test(nm)) s+=3;
      if(v.localService) s+=1;
      if(s>bs){ bs=s; best=v; }
    }
    cachedVoice=best; voiceIsFemale=!!best && FEMALE_V.test(best.name+' '+(best.voiceURI||''));
  }catch(e){}
}

  return new Promise(res=>{
    if(token!==sayToken) return res();
    try{
      if(!cachedVoice) chooseVoice();
      const u=new SpeechSynthesisUtterance(text);
      if(cachedVoice){ u.voice=cachedVoice; u.lang=cachedVoice.lang; } else u.lang='en-US';
      u.rate=rate; u.pitch=voiceIsFemale?1.1:1.35; u.volume=1;

      u.onend=fin; u.onerror=fin; setTimeout(fin, Math.max(1600, text.length*120/rate));
      speechSynthesis.speak(u);

  });

async function say(parts,opts){
  opts=opts||{}; parts=Array.isArray(parts)?parts:[parts];
  const token=++sayToken;
  if(muted||!('speechSynthesis' in window)){ await wait(opts.silentMs||500); return; }

  const base = me ? {little:.75, middle:.82, older:.9}[bandOf(me)] : .82;
  const rate = opts.rate || (subject==='english' ? Math.min(base,.78) : base);
  for(let i=0;i<parts.length;i++){
    if(token!==sayToken) return;
    await speakOne(parts[i], rate, token);
    if(i<parts.length-1) await wait(opts.gap||450);
  }
}

function gFractions(lv){

    const d=pick(T(lv,[[2,4],[2,3,4,6],[3,4,5,6,8]])), k=R(1,d-1), want=lv===3?4:3, opts=[[k,d]];
    for(const c of shuffle([[d-k,d],[k,d+1],[k+1,d],[k,d-1],[1,k+1],[k,2*d],[d,k+d]].filter(([a,b])=>a>0&&b>1&&a<b))){ if(opts.length>=want) break; if(!opts.some(([a,b])=>Math.abs(a/b-c[0]/c[1])<1e-9)) opts.push(c); }
    return {text:'What fraction is shaded?', speak:'What fraction of the circle is shaded?', html:`<div class="fig">${pieSVG(k,d)}</div>`+choices(shuffle(opts).map(([a,b])=>`<button class="opt word" data-choice="${a}/${b}" aria-label="${a} over ${b}" style="font-size:30px">${frac(a,b)}</button>`)), why:()=>({html:hintBox('Top number: the coloured parts.', '<div>Bottom number: all the equal parts.</div>'), say:'Count the coloured parts for the top number. Count all the parts for the bottom number.'}), answer:`${k}/${d}`, praise:`Yes! ${k} out of ${d} equal parts.`};
  }
  if(lv===4||lv===5){
    let A,B;
    if(lv===4){ const d=R(3,10); let x=R(1,d-1),y; do{y=R(1,d-1);}while(y===x); A=[x,d]; B=[y,d]; }
    else { let x=R(2,10),y; do{y=R(2,10);}while(y===x); A=[1,x]; B=[1,y]; }
    const ans=A[0]/A[1]>B[0]/B[1]?'L':'R', big=ans==='L'?A:B;
    return {text:'Which fraction is bigger?', speak:'Which fraction is bigger?', html:`<div class="vs"><button class="opt wide" data-choice="L" style="font-size:52px;font-weight:700">${frac(A[0],A[1])}</button><button class="opt wide" data-choice="R" style="font-size:52px;font-weight:700">${frac(B[0],B[1])}</button></div>`,
      why:()=>{ const pie=(f)=>`<div>${pieSVG(f[0],f[1]).replace('class="pie"','class="pie" style="width:104px"')}<div class="w-eq">${f[0]}/${f[1]}</div></div>`; return {html:hintBox('Look at both as pies. Which has more coloured?', `<div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap">${pie(A)}${pie(B)}</div>`), say:'Look at both as pies. Which one has more coloured?'}; },
      answer:ans, praise: lv===5?`Yes! ${big[0]} over ${big[1]}. Fewer parts means bigger parts.`:`Yes! ${big[0]} over ${big[1]} is bigger.`};
  }
  if(lv===6||lv===7){ const d=pick([2,3,4,5,8,10]), k=lv===6?1:R(2,d-1), m=R(2,lv===6?10:12), n=d*m;
    return P({text:'Fraction of a number', speak:`What is ${k} over ${d} of ${n}?`, html:`<div class="eq">${frac(k,d)} of ${n} = ${SLOT}</div>`, answer:String(k*m), explain:`${n} ÷ ${d} = ${m}, then × ${k} = ${k*m}`}); }
  if(lv===8){ let d=R(2,6),k=R(1,d-1); while(gcd(k,d)!==1) k=R(1,d-1); const m=R(2,4);
    return P({text:'Equivalent fractions', speak:`${k} over ${d} equals what over ${d*m}?`, html:`<div class="eq">${frac(k,d)} = ${frac(SLOT,d*m)}</div>`, answer:String(k*m), explain:`Multiply top and bottom by ${m}: ${k*m} over ${d*m}`}); }
  if(lv===9){ const d=R(5,12), a=R(1,d-2), b=R(1,d-1-a);
    return P({text:'Add the fractions', speak:`What is ${a} over ${d} plus ${b} over ${d}?`, html:`<div class="eq">${frac(a,d)} + ${frac(b,d)} = ${frac(SLOT,d)}</div>`, answer:String(a+b), explain:`Same bottom number, so add the tops: ${a} + ${b} = ${a+b}`}); }
  let d=R(2,6),k=R(1,d-1); while(gcd(k,d)!==1) k=R(1,d-1); const m=R(2,5);
  return P({text:'Simplify', speak:`Simplify ${k*m} over ${d*m}. ${k} over what?`, html:`<div class="eq">${frac(k*m,d*m)} = ${frac(k,SLOT)}</div>`, answer:String(d), explain:`Divide top and bottom by ${m}: ${k} over ${d}`});
}
function gDecimals(lv){
  const D=o=>P(Object.assign({decimal:true},o));
  if(lv===1||lv===4){
    let a,b;
    if(lv===1){ a=R(1,9)/10; do{ b=R(1,9)/10; }while(b===a); }
    else { a=R(2,9)/10; b=Math.round((a - pick([0.01,0.05,0.09]) + pick([0,0.1]))*100)/100; if(b===a) b=a+0.05; b=Math.round(b*100)/100; }
    const ans=a>b?'L':'R', big=Math.max(a,b);
    return {text:'Which is bigger?', speak:'Which number is bigger?', html:`<div class="vs"><button class="opt wide" data-choice="L" style="font-size:48px;font-weight:700">${fmt(a)}</button><button class="opt wide" data-choice="R" style="font-size:48px;font-weight:700">${fmt(b)}</button></div>`, why:()=>({html:hintBox(`${a.toFixed(2)} and ${b.toFixed(2)}`, '<div>Give both the same number of decimal places, then compare.</div>'), say:'Give both numbers the same number of decimal places, then compare.'}), answer:ans, praise:`Yes! ${fmt(big)} is bigger.`};
  }
  let a,b,op,ans;
  switch(lv){
    case 2: a=R(1,8)/10; b=R(1,9-a*10)/10; op='+'; break;
    case 3: a=R(3,9)/10; b=R(Math.max(1,10-a*10),9)/10; op='+'; break;
    case 5: a=R(1,15)*5/100; b=R(1,15)*5/100; op='+'; break;
    case 6: a=R(15,50)/10; b=R(1,9)/10; op='−'; break;
    case 7: a=R(11,99)/10; b=10; op='×'; break;
    case 8: a=R(11,99); b=10; op='÷'; break;
    case 9: if(rnd()<.5){ a=R(101,999)/100; b=100; op='×'; } else { a=R(11,999); b=100; op='÷'; } break;
    default: a=R(5,50)/10; b=R(5,60)*5/100; op='+';
  }
  ans = op==='+'?a+b : op==='−'?a-b : op==='×'?a*b : a/b;
  return D({hint:decHint(a,b,op), text:'Work it out', speak:speakify(`What is ${fmt(a)} ${op} ${fmt(b)}?`), html:`<div class="eq">${fmt(a)} ${op} ${fmt(b)} = ${SLOT}</div>`, answer:fmt(ans), explain:`${fmt(a)} ${op} ${fmt(b)} = ${fmt(ans)}`});
}
function gPercent(lv){
  const L = lv===6 ? pick([1,2,3,4,5]) : lv===10 ? pick([7,8,9]) : lv;
  let txt, ans, ex;
  if(L<=5){
    const [p,base]=T(L,[[50,R(1,50)*2],[25,R(1,25)*4],[10,R(1,20)*10],[75,R(1,25)*4],pick([[20,R(1,10)*20],[5,R(1,10)*20]])]);
    ans=base*p/100; txt=`${p}% of ${base}`; ex=`${p}% means ${p} out of 100. ${base} × ${p} ÷ 100 = ${ans}`;
  } else if(L===7){ const p=pick([10,20,25,50,75]), whole=pick([20,40,60,80,100].filter(w=>w*p%100===0)), part=whole*p/100;
    return P({text:'What percent?', speak:`${part} out of ${whole} is what percent?`, html:`<div class="eq">${part} out of ${whole} = ${SLOT} %</div>`, answer:String(p), explain:`${part} ÷ ${whole} = ${p/100}, which is ${p}%`});
  } else if(L===8){ const p=pick([10,50]), base=R(2,20)*10; ans=base+base*p/100; txt=`${base} increased by ${p}%`; ex=`${p}% of ${base} is ${base*p/100}, so ${base} + ${base*p/100} = ${ans}`; }
  else { const p=pick([10,25,50]), base=p===10?R(2,20)*10:R(2,25)*4; ans=base-base*p/100; txt=`${base} with ${p}% off`; ex=`${p}% of ${base} is ${base*p/100}, so ${base} − ${base*p/100} = ${ans}`; }
  return P({text:'Percentages', speak:`What is ${txt}?`, html:`<div class="eq sm">${txt} = ${SLOT}</div>`, answer:String(ans), explain:ex});
}
function gSequence(lv){
  let seq, rule; const six=f=>[0,1,2,3,4,5].map(f);
  switch(lv){
    case 1: { const s=R(3,9),a=R(1,20); seq=six(i=>a+i*s); rule=`add ${s}`; break; }
    case 2: { const s=R(11,25),a=R(5,40); seq=six(i=>a+i*s); rule=`add ${s}`; break; }
    case 3: { const s=R(3,12),a=R(70,130); seq=six(i=>a-i*s); rule=`subtract ${s}`; break; }
    case 4: { const a=R(1,5); seq=six(i=>a*Math.pow(2,i)); rule='double each time'; break; }
    case 5: { const a=R(1,3); seq=six(i=>a*Math.pow(3,i)); rule='multiply by 3'; break; }
    case 6: { const a=R(1,10),s0=R(1,3); seq=[a]; for(let i=1;i<6;i++) seq.push(seq[i-1]+s0+i-1); rule='the jump grows by 1 each time'; break; }
    case 7: { const o=R(1,4); seq=six(i=>(i+o)*(i+o)); rule='square numbers'; break; }
    case 8: { const o=R(0,2); seq=six(i=>(i+o+1)*(i+o+2)/2); rule='add 1 more each time (triangle numbers)'; break; }
    case 9: { const a=R(1,3),b=R(a,a+3); seq=[a,b]; for(let i=2;i<6;i++) seq.push(seq[i-1]+seq[i-2]); rule='add the two numbers before'; break; }
    default: { const t=pick(['half','cube','alt']);
      if(t==='half'){ const a=pick([3,5,7])*32; seq=six(i=>a/Math.pow(2,i)); rule='halve each time'; }
      else if(t==='cube'){ seq=six(i=>(i+1)**3); rule='cube numbers'; }
      else { const a=R(2,10),x=R(3,6),y=R(1,2); seq=[a]; for(let i=1;i<6;i++) seq.push(seq[i-1]+(i%2?x:-y)); rule=`add ${x}, subtract ${y}, repeat`; } }
  }
  return P({text:'What comes next?', speak:'What number comes next in the pattern?', html:`<div class="eq sm">${seq.slice(0,5).join(', ')}, ${SLOT}</div>`, answer:String(seq[5]), explain:`Rule: ${rule}. Next is ${seq[5]}`});
}
function gLogic(lv){
  const [X,Y,Z]=shuffle(['🍎','🍌','🍇','⭐','🐸','🌙','🔺','🔷']); let lines, ans, ex;
  switch(lv){
    case 1: { const a=R(2,12); lines=[`${X} + ${X} = ${2*a}`,`${X} = ${SLOT}`]; ans=a; ex=`${2*a} ÷ 2 = ${a}`; break; }
    case 2: { const a=R(2,12),b=R(2,12); lines=[`${X} + ${Y} = ${a+b}`,`${X} = ${a}`,`${Y} = ${SLOT}`]; ans=b; ex=`${a+b} − ${a} = ${b}`; break; }
    case 3: { const a=R(2,10),b=R(2,10); lines=[`${X} + ${X} = ${2*a}`,`${X} + ${Y} = ${a+b}`,`${Y} = ${SLOT}`]; ans=b; ex=`${X} = ${a}, so ${Y} = ${b}`; break; }
    case 4: { const k=R(3,6),a=R(2,9); lines=[`${X} × ${k} = ${k*a}`,`${X} = ${SLOT}`]; ans=a; ex=`${k*a} ÷ ${k} = ${a}`; break; }
    case 5: { const a=R(8,20),b=R(2,a-1); lines=[`${X} − ${Y} = ${a-b}`,`${X} = ${a}`,`${Y} = ${SLOT}`]; ans=b; ex=`${a} − ${a-b} = ${b}`; break; }
    case 6: { const a=R(2,9),b=R(2,9),c=R(2,9); lines=[`${X} + ${X} + ${X} = ${3*a}`,`${X} + ${Y} = ${a+b}`,`${Y} + ${Z} = ${b+c}`,`${Z} = ${SLOT}`]; ans=c; ex=`${X} = ${a}, ${Y} = ${b}, so ${Z} = ${c}`; break; }
    case 7: { const a=R(3,12); lines=[`${X} × ${X} = ${a*a}`,`${X} = ${SLOT}`]; ans=a; ex=`${a} × ${a} = ${a*a}`; break; }
    case 8: { const a=R(2,8),b=R(2,8); lines=[`${X} + ${X} + ${Y} = ${2*a+b}`,`${X} + ${Y} = ${a+b}`,`${Y} = ${SLOT}`]; ans=b; ex=`Subtract: ${X} = ${a}, so ${Y} = ${b}`; break; }
    case 9: { const a=R(2,12)*2,b=R(2,9); lines=[`${X} ÷ 2 = ${a/2}`,`${X} − ${Y} = ${a-b}`,`${Y} = ${SLOT}`]; ans=b; ex=`${X} = ${a}, so ${Y} = ${b}`; break; }
    default: { const a=R(2,6),b=R(2,6),c=R(2,9); lines=[`${X} × ${Y} = ${a*b}`,`${X} + ${Y} = ${a+b}`,`${X} > ${Y}`.replace('>', a>=b?'≥':'≤'),`${X} × ${Y} + ${Z} = ${a*b+c}`,`${Z} = ${SLOT}`]; ans=c; ex=`${a*b+c} − ${a*b} = ${c}`; }
  }
  return P({text:'Solve the puzzle', speak:'Each picture stands for a number. Find the missing number.', html:`<div class="eqlines">${lines.map(l=>`<div>${l}</div>`).join('')}</div>`, answer:String(ans), explain:ex});
}
function gArea(lv){
  let w,h,html,ans,txt,ex;
  switch(lv){
    case 1: w=R(2,4); h=R(2,3); html=rectFig(w,h,{grid:1,labels:false}); ans=w*h; txt='How many squares?'; ex=`${h} rows of ${w} = ${ans} squares`; break;
    case 2: w=R(2,5); h=R(2,5); html=rectFig(w,h,{grid:1}); ans=w*h; txt='Area (cm²)'; ex=`Area = ${w} × ${h} = ${ans} cm²`; break;
    case 3: w=R(2,5); h=R(2,4); html=rectFig(w,h,{grid:1}); ans=2*(w+h); txt='Perimeter (cm)'; ex=`Perimeter = ${w} + ${h} + ${w} + ${h} = ${ans} cm`; break;
    case 4: w=R(4,8); h=R(3,6); html=rectFig(w,h,{grid:1}); ans=w*h; txt='Area (cm²)'; ex=`${w} × ${h} = ${ans} cm²`; break;
    case 5: w=R(4,8); h=R(3,6); html=rectFig(w,h,{grid:1}); ans=2*(w+h); txt='Perimeter (cm)'; ex=`2 × (${w} + ${h}) = ${ans} cm`; break;
    case 6: w=R(3,12); h=R(3,10); html=rectFig(w,h); ans=w*h; txt='Area (cm²)'; ex=`${w} × ${h} = ${ans} cm²`; break;
    case 7: w=R(3,15); h=R(3,12); html=rectFig(w,h); ans=2*(w+h); txt='Perimeter (cm)'; ex=`2 × (${w} + ${h}) = ${ans} cm`; break;
    case 8: w=R(3,10); h=R(3,10); html=rectFig(w,h,{hl:'? cm'})+`<div class="story">Area = <b>${w*h} cm²</b></div>`; ans=h; txt='Find the missing side'; ex=`${w*h} ÷ ${w} = ${h} cm`; break;
    case 9: { const w1=R(2,6),h1=R(2,6),w2=R(2,6),h2=R(2,6); html=twoRectFig(w1,h1,w2,h2); ans=w1*h1+w2*h2; txt='Total area (cm²)'; ex=`${w1}×${h1} + ${w2}×${h2} = ${ans} cm²`; break; }
    default: w=R(3,12); h=R(3,10); html=rectFig(w,h,{hl:'? cm'})+`<div class="story">Perimeter = <b>${2*(w+h)} cm</b></div>`; ans=h; txt='Find the missing side'; ex=`${2*(w+h)} ÷ 2 = ${w+h}, then − ${w} = ${h} cm`;
  }
  return P({text:txt, speak:txt.replace('cm²','square centimetres').replace('(cm)',''), html:html+`<div class="eq sm">${SLOT}</div>`, answer:String(ans), explain:ex});
}
function gOrderOps(lv){
  const L = lv===10 ? pick([6,7,8,9]) : lv; let e, ans, ex;
  switch(L){
    case 1: { const a=R(1,9),b=R(2,6),c=R(2,6); e=`${a} + ${b} × ${c}`; ans=a+b*c; ex=`Multiply first: ${b}×${c} = ${b*c}, then + ${a} = ${ans}`; break; }
    case 2: { const a=R(2,6),b=R(2,6),c=R(1,9); e=`${a} × ${b} + ${c}`; ans=a*b+c; ex=`${a}×${b} = ${a*b}, then + ${c} = ${ans}`; break; }
    case 3: { const b=R(2,5),c=R(2,5),a=b*c+R(1,15); e=`${a} − ${b} × ${c}`; ans=a-b*c; ex=`${b}×${c} = ${b*c}, then ${a} − ${b*c} = ${ans}`; break; }
    case 4: { const a=R(1,6),b=R(1,6),c=R(2,6); e=`(${a} + ${b}) × ${c}`; ans=(a+b)*c; ex=`Brackets first: ${a+b}, then × ${c} = ${ans}`; break; }
    case 5: { const c=R(2,6),b=c*R(2,6),a=R(1,12); e=`${a} + ${b} ÷ ${c}`; ans=a+b/c; ex=`Divide first: ${b}÷${c} = ${b/c}, then + ${a} = ${ans}`; break; }
    case 6: { const a=R(2,6),c=R(1,6),b=c+R(1,6); e=`${a} × (${b} − ${c})`; ans=a*(b-c); ex=`Brackets: ${b-c}, then × ${a} = ${ans}`; break; }
    case 7: { const b=R(2,5),c=R(2,5),a=R(1,10),d=R(1,a+b*c-1); e=`${a} + ${b} × ${c} − ${d}`; ans=a+b*c-d; ex=`${b}×${c} = ${b*c}; ${a} + ${b*c} − ${d} = ${ans}`; break; }
    case 8: { const a=R(1,6),b=R(1,6),d=R(1,5),c=d+R(1,5); e=`(${a} + ${b}) × (${c} − ${d})`; ans=(a+b)*(c-d); ex=`${a+b} × ${c-d} = ${ans}`; break; }
    default: { const a=R(2,9),b=R(1,20); e=`${a}² + ${b}`; ans=a*a+b; ex=`${a}² = ${a*a}, then + ${b} = ${ans}`; }
  }
  return P({text:'Brackets and order', speak:speakify(`Work out ${e}. Remember the order of operations.`), html:`<div class="eq sm">${e} = ${SLOT}</div>`, answer:String(ans), explain:ex});
}
function gWords(lv){
  const n1=pick(NAMES), n2=pick(NAMES.filter(x=>x!==n1)); let s, ans, ex;
  switch(lv){
    case 1: { const a=R(120,400),b=R(35,a-20); ans=a-b; s=`A shop had ${a} mangoes and sold ${b}. How many mangoes are left?`; ex=`${a} − ${b} = ${ans}`; break; }
    case 2: { const b=R(4,9),e=R(6,12); ans=b*e; s=`There are ${b} boxes with ${e} pencils in each. How many pencils in total?`; ex=`${b} × ${e} = ${ans}`; break; }
    case 3: { const k=R(3,9),e=R(4,12); ans=e; s=`${k*e} sweets are shared equally between ${k} children. How many does each child get?`; ex=`${k*e} ÷ ${k} = ${e}`; break; }
    case 4: { const p=R(3,6),e=R(6,12),g=R(5,p*e-5); ans=p*e-g; s=`${n1} buys ${p} packs of ${e} stickers and gives ${g} to ${n2}. How many stickers are left?`; ex=`${p} × ${e} = ${p*e}, minus ${g} = ${ans}`; break; }
    case 5: { const a=R(12,40),b=R(10,40),pay=Math.ceil((a+b+1)/10)*10+pick([0,10,20]); ans=pay-a-b; s=`${n1} buys a book for $${a} and a bag for $${b}, and pays with $${pay}. How much change?`; ex=`${a} + ${b} = ${a+b}; ${pay} − ${a+b} = ${ans}`; break; }
    case 6: { const h1=R(7,10),m1=pick([0,10,20,30,40,50]),dur=R(5,20)*5,tot=h1*60+m1+dur; ans=dur; s=`A bus leaves at ${h1}:${pad2(m1)} and arrives at ${Math.floor(tot/60)}:${pad2(tot%60)}. How many minutes is the trip?`; ex=`From ${h1}:${pad2(m1)} to ${Math.floor(tot/60)}:${pad2(tot%60)} is ${dur} minutes`; break; }
    case 7: { const d=pick([3,4,5]),k=R(1,d-1),cl=d*R(5,8); ans=cl*k/d; s=`A class has ${cl} pupils. ${k}/${d} of them walk to school. How many walk?`; ex=`${cl} ÷ ${d} = ${cl/d}, × ${k} = ${ans}`; break; }
    case 8: { const p=pick([10,20,25,50]),price=p===10||p===20?R(2,20)*10:R(2,25)*4; ans=price-price*p/100; s=`A pair of shoes costs $${price}. In a sale they are ${p}% off. What is the sale price?`; ex=`${p}% of ${price} = ${price*p/100}; ${price} − ${price*p/100} = ${ans}`; break; }
    case 9: { const sp=pick([40,50,60,80]),h=R(2,6); ans=sp*h; s=`A car travels ${sp} km every hour. How far does it go in ${h} hours?`; ex=`${sp} × ${h} = ${ans} km`; break; }
    default: { const f=pick([2,3,4,6]),pz=R(2,4),sl=pick([6,8,12]); if((pz*sl)%f){ return gWords(10); } ans=pz*sl/f; s=`${f} friends share ${pz} pizzas. Each pizza is cut into ${sl} slices. How many slices does each friend get?`; ex=`${pz} × ${sl} = ${pz*sl} slices; ÷ ${f} = ${ans}`; }
  }
  return P({text:'Word problem', speak:s, html:`<div class="story">${esc(s)}</div><div class="eq sm">${SLOT}</div>`, answer:String(ans), explain:ex});
}

/* ---------- microphone helpers (recordings never leave the phone) ---------- */
const micOK = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
async function recordClip(ms){
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  return new Promise((res,rej)=>{
    const chunks=[]; let rec;
    try{ rec=new MediaRecorder(stream); }catch(e){ stream.getTracks().forEach(t=>t.stop()); return rej(e); }
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); res(new Blob(chunks,{type:rec.mimeType||'audio/webm'})); };
    rec.start(); setTimeout(()=>{ try{ rec.stop(); }catch(e){} }, ms);
  });
}
function playParrot(blob){
  return new Promise(res=>{
    const a=new Audio(URL.createObjectURL(blob)); let done=false; const fin=()=>{ if(!done){ done=true; try{ URL.revokeObjectURL(a.src); }catch(e){} res(); } };
    a.preservesPitch=false; a.mozPreservesPitch=false; a.webkitPreservesPitch=false; a.playbackRate=1.4;
    a.onended=fin; a.onerror=fin; a.play().catch(fin); setTimeout(fin, 9000);
  });
}
const squawk = () => { tone(1400,0,.08,'sawtooth',.06); tone(1800,.09,.1,'sawtooth',.06); };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listenOnce(){
  return new Promise(res=>{
    let r; try{ r=new SR(); }catch(e){ return res({err:'nosr'}); }
    r.lang='en-US'; r.interimResults=false; r.maxAlternatives=5;
    let out=null;
    r.onresult=e=>{ out=[...e.results[0]].map(a=>a.transcript.toLowerCase().trim()); };
    r.onerror=e=>{ if(!out) out={err:e.error||'error'}; };
    r.onend=()=>res(out||{err:'no-speech'});
    try{ r.start(); }catch(e){ return res({err:'start'}); }
    setTimeout(()=>{ try{ r.stop(); }catch(e){} }, 6000);
  });
}
function lev(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>1) return 9; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
const SYN = {mother:['mum','mom','mommy','mummy','mama'],father:['dad','daddy','papa'],grandmother:['grandma','granny','nana'],grandfather:['grandpa','granddad'],cup:['mug'],cap:['hat'],phone:['mobile','telephone'],bike:['bicycle'],plane:['aeroplane','airplane'],television:['tv','telly'],sea:['ocean','waves'],rabbit:['bunny'],hen:['chicken'],sheep:['lamb'],trousers:['pants','jeans'],bajaj:['tuk tuk','tuktuk','rickshaw'],'police officer':['police','policeman','policewoman'],house:['home'],plate:['dish'],tooth:['teeth'],foot:['feet'],glasses:['spectacles'],flower:['rose'],mountain:['hill'],doctor:['nurse'],baby:['child'],finger:['one'],heart:['love'],arm:['muscle'],laughing:['smiling'],drinking:['juice']};
function saidRight(alts, it){
  const targets=[it.w, ...(SYN[it.w]||[])];
  const stem = it.act ? it.w.replace(/ing$/,'').replace(/([bcdfgklmnprstvz])\1$/,'$1') : null;
  return alts.some(alt=>{ const toks=alt.replace(/[^a-z\s']/g,' ').split(/\s+/).filter(Boolean);
    return targets.some(t=> t.includes(' ') ? alt.includes(t) : toks.some(x=> x===t || x===t+'s' || x===t+'es' || (t.length>=4 && lev(x,t)<=1) || (stem && x.startsWith(stem))));
  });
}

        if(!Array.isArray(r)){
          if(r.err==='not-allowed'||r.err==='service-not-allowed'){ grownUp('The microphone is off. Say it out loud, and a grown-up taps 👍.'); return; }

          heard.textContent="I didn't hear anything. Tap and try again, a bit louder."; say("I didn't hear you. Try again, a bit louder."); return;

        else say('Not quite. Try again.');
      });

/* ---------- Rhyme Rocket (sound play) ---------- */
const RHYMES = [[['cat','🐱'],['hat','🎩']],[['dog','🐶'],['frog','🐸']],[['bee','🐝'],['tree','🌳'],['key','🔑'],['three','3️⃣']],[['star','⭐'],['car','🚗']],[['goat','🐐'],['boat','⛵'],['coat','🧥']],[['mouse','🐭'],['house','🏠']],[['fish','🐟'],['dish','🍽️']],[['moon','🌙'],['spoon','🥄'],['balloon','🎈']],[['bear','🐻'],['pear','🍐'],['chair','🪑']],[['snake','🐍'],['cake','🍰']],[['ring','💍'],['king','🤴']],[['bell','🔔'],['shell','🐚']],[['clock','🕰️'],['sock','🧦'],['lock','🔒']],[['fox','🦊'],['box','📦']],[['hen','🐔'],['ten','🔟'],['pen','🖊️']],[['rain','🌧️'],['train','🚂'],['plane','✈️']],[['nose','👃'],['rose','🌹'],['toes','🦶']],[['bed','🛏️'],['bread','🍞']],[['tie','👔'],['pie','🥧']],[['whale','🐋'],['snail','🐌']],[['shoe','👟'],['two','2️⃣']],[['four','4️⃣'],['door','🚪']]].map(g=>g.map(([w,e])=>({w,e})));
function eRhyme(lv){
  if(lv>=9){
    const g3=pick(RHYMES.filter(g=>g.length>=3)), three=shuffle(g3).slice(0,3), odd=pick(pick(RHYMES.filter(g=>g!==g3)));
    const opts=shuffle([...three,odd]), names=three.map(o=>o.w).join(', ');

      why:(st,c,btn)=>({say:`${c} rhymes with the others. Listen again: ${opts.map(o=>o.w).join(', ')}.`}),

  }
  const g=pick(RHYMES), [t,m]=shuffle(g), k=T(lv,[2,2,2,3,3,3,3,3]);

  const dist=[]; for(const o of others){ if(dist.length>=k-1) break; if(!dist.some(d=>d.w===o.w)) dist.push(o); }

/* ---------- Trace the Trail (writing letters) ---------- */
const TRACE = [['s','a','t'],['p','i','n'],['m','d','g'],['o','c','k'],['e','u','r'],['h','b','f','l'],['j','v','w','x','y','z','q'],['A','B','C','D','E','F','H','M'],['N','P','R','S','T','W','Y','Z'],['cat','sun','dog','hen','bus','cup']];
const TRACE_WORD = {a:'apple',b:'ball',c:'cat',d:'dog',e:'egg',f:'fish',g:'goat',h:'hat',i:'insect',j:'juice',k:'key',l:'lion',m:'moon',n:'nose',o:'octopus',p:'pen',q:'queen',r:'rain',s:'sun',t:'tree',u:'umbrella',v:'van',w:'water',x:'box',y:'yellow',z:'zebra'};
function eTrace(lv){
  const ch=pick(T(lv,TRACE)), word=ch.length>1, low=ch.toLowerCase();
  const line = word ? `Trace the word ${ch}.` : `Trace the letter ${low}. ${low}, for ${TRACE_WORD[low]}.`;
  let myQ;
  myQ = {text: word?`Trace the word “${ch}”`:`Trace the letter ${ch}`, speak:line, answer:ch, noReview:true,
    html:`<div class="trace"><canvas id="tc" aria-label="Tracing area"></canvas></div><p class="heard" id="tMsg">Use your finger. Stay on the grey ${word?'word':'letter'}.</p><div class="btns"><button class="btn small" id="tClear">↺ Start again</button></div>`,
    mount(){
      const cv=$('tc'), dpr=Math.min(2,window.devicePixelRatio||1), W=Math.min(340, innerWidth-40), H=word?Math.round(W*0.62):Math.min(300,W);
      cv.style.width=W+'px'; cv.style.height=H+'px'; cv.width=W*dpr; cv.height=H*dpr;
      const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
      const fs = word ? W/(ch.length*0.62) : H*0.78, brush=Math.max(14, fs*0.15);
      const font=`700 ${fs}px "Andika","Comic Sans MS","Trebuchet MS",system-ui,sans-serif`;
      const off=document.createElement('canvas'); off.width=W; off.height=H; const o=off.getContext('2d');
      o.font=font; o.textAlign='center'; o.textBaseline='middle'; o.fillText(ch, W/2, H/2+fs*0.04);
      const mask=o.getImageData(0,0,W,H).data;
      const off2=document.createElement('canvas'); off2.width=W; off2.height=H; const o2=off2.getContext('2d');
      o2.font=font; o2.textAlign='center'; o2.textBaseline='middle'; o2.lineWidth=brush*1.8; o2.lineJoin='round'; o2.strokeText(ch, W/2, H/2+fs*0.04); o2.fillText(ch, W/2, H/2+fs*0.04);
      const near=o2.getImageData(0,0,W,H).data;
      const STEP=4, target=[]; for(let y=0;y<H;y+=STEP) for(let x=0;x<W;x+=STEP) if(mask[(y*W+x)*4+3]>100) target.push([x,y]);
      let covered=new Set(), inside=0, outside=0, drawing=false, last=null, restarts=0;
      const guide=()=>{ ctx.clearRect(0,0,W,H); ctx.font=font; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#E3E8F6'; ctx.fillText(ch, W/2, H/2+fs*0.04);
        ctx.setLineDash([6,6]); ctx.lineWidth=2; ctx.strokeStyle='#AEB8D6'; ctx.strokeText(ch, W/2, H/2+fs*0.04); ctx.setLineDash([]); };
      guide();
      const alive=()=>current==='sPlay' && q===myQ;
      const pos=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width, (e.clientY-r.top)*H/r.height]; };
      const mark=(x,y)=>{ const xi=Math.round(x), yi=Math.round(y); if(xi>=0&&yi>=0&&xi<W&&yi<H&&near[(yi*W+xi)*4+3]>60) inside++; else outside++;
        const r2=brush*brush*0.6; target.forEach((p,i)=>{ const dx=p[0]-x, dy=p[1]-y; if(dx*dx+dy*dy<=r2) covered.add(i); }); };
      const seg=(a,b)=>{ ctx.strokeStyle=getComputedStyle(document.querySelector('.app')).getPropertyValue('--acc')||'#3657E0'; ctx.lineWidth=brush; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
        const n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/4)); for(let i=1;i<=n;i++) mark(a[0]+(b[0]-a[0])*i/n, a[1]+(b[1]-a[1])*i/n); };
      const reset=()=>{ covered=new Set(); inside=0; outside=0; guide(); };
      cv.addEventListener('pointerdown',e=>{ if(locked) return; e.preventDefault(); audio(); cv.setPointerCapture(e.pointerId); drawing=true; last=pos(e); seg(last,last); });
      cv.addEventListener('pointermove',e=>{ if(!drawing) return; e.preventDefault(); const p=pos(e); seg(last,p); last=p; });
      const up=()=>{ if(!drawing) return; drawing=false; if(!alive()||locked) return;
        const cov=covered.size/Math.max(1,target.length), out=outside/Math.max(1,inside+outside);
        if(out>0.35 && inside+outside>40){ restarts++; tries++; boop(); $('tMsg').textContent='Oops! Stay on the grey line. Try again.'; say('Stay on the grey line. Try again.'); setTimeout(reset,500); return; }
        if(cov>=0.72){ $('tMsg').textContent='Beautiful!'; customDone(restarts===0, ()=>say(word?`Well done! ${ch}.`:`Well done! That is ${low}. ${low}, for ${TRACE_WORD[low]}.`)); return; }
        $('tMsg').textContent = cov>0.35 ? 'Keep going! Cover all the grey.' : 'Use your finger. Stay on the grey.';
      };
      cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up); cv.addEventListener('pointerleave',up);
      $('tClear').addEventListener('click',()=>{ restarts++; reset(); $('tMsg').textContent='Use your finger. Stay on the grey.'; });
    }};
  return myQ;

        if(typed===it.w){ cells().forEach(c=>c.className='ok'); customDone(misses===0, ()=>say(`Yes! ${it.w}. ${it.w.split('').join(', ')}.`)); return; }
        misses++; tries++; boop(); const bw=$('bWord'); bw.classList.remove('shake'); void bw.offsetWidth; bw.classList.add('shake');
        if(misses>=2){ $('bMsg').innerHTML=`It is spelled <b>${esc(it.w)}</b>. Type it once more.`; say(`It is spelled: ${it.w.split('').join(', ')}. Type it once more.`); }
        else { $('bMsg').textContent='Not quite. Listen again and try.'; say(['Not quite. Listen again.', `${it.w}.`, it.s]); }
        typed=''; setTimeout(draw,300);
      };
      document.querySelector('.kb').addEventListener('click',e=>{ const b=e.target.closest('[data-kl]'); if(!b||locked) return; audio(); const k=b.dataset.kl;
        if(k==='del'){ typed=typed.slice(0,-1); draw(); return; } if(k==='go'){ go(); return; }
        if(typed.length>=it.w.length+3) return; typed+=k; tick(); draw(); });
    }};
  return myQ;
}

const FIX_BASIC = ['The cat is on the mat.','We go to school.','My dad has a big car.','The sun is hot today.','We eat rice for dinner.','The goat is in the garden.','My mum likes tea.','The bus is very full.','Birds can fly high.','The baby is happy.'];

const FIX_Q = ['Where is my shoe?','Can you help me?','What is your name?','Do you like milk?','How old are you?','Who is your teacher?'];
const FIX_GRAM = [
  ['I ate an apple.',['I ate a apple.']],['She has an umbrella.',['She has a umbrella.']],['It is an orange cat.',['It is a orange cat.']],['I saw an elephant.',['I saw a elephant.']],['He has a red bag.',['He has an red bag.']],
  ['The children were playing.',['The children was playing.']],['My friends are here.',['My friends is here.']],['The cat is sleeping.',['The cat are sleeping.']],['We were very happy.',['We was very happy.']],['They are my cousins.',['They is my cousins.']],
  ['Yesterday I went to the market.',['Yesterday I goed to the market.','Yesterday I go to the market.']],['She ate her dinner.',['She eated her dinner.']],['We saw a big camel.',['We seed a big camel.']],['He ran to school.',['He runned to school.']],['I wrote a letter.',['I writed a letter.']],['They came home late.',['They comed home late.']]

function eFix(lv){
  let right, wrongs, rule;
  if(lv<=3){ right=pick(FIX_BASIC); const low=right[0].toLowerCase()+right.slice(1); wrongs=[low, right.slice(0,-1)]; if(lv===3) wrongs=[low.slice(0,-1), low, right.slice(0,-1)].slice(0,2);
    rule='A sentence starts with a capital letter and ends with a full stop.'; }
  else if(lv<=5){ const [s,ws]=pick(FIX_NAMES); right=s; wrongs=ws.map(w=>s.replace(new RegExp('\\b'+w.charAt(0).toUpperCase()+w.slice(1)+'\\b'), w)); rule='Names of people, places, days and months, and the word I, always have a capital letter.'; }
  else if(lv<=7){ right=pick(FIX_Q); wrongs=[right.slice(0,-1)+'.', right[0].toLowerCase()+right.slice(1)]; rule='A question ends with a question mark.'; }
  else { const pool=FIX_GRAM.slice(lv===8?0:lv===9?5:10, lv===8?5:lv===9?10:16), [s,ws]=pick(pool); right=s; wrongs=ws; rule=lv===8?'We use an before a vowel sound, like an apple.':lv===9?'Use were and are with more than one, and was and is with one.':'Some doing words change in the past: go becomes went, eat becomes ate.'; }
  const opts=shuffle([right,...[...new Set(wrongs)].filter(w=>w!==right)]).map(t=>({v:t,t}));
  return {text:'Tap the sentence that is written correctly', parts:['Which sentence is written correctly?'], answer:right,
    html:textBtns(opts,'sent'),
    why:()=>({html:`<div>${esc(rule)}</div>`, say:rule}),
    async after(){ await say(['Yes! Well spotted.', rule]); }};
}

}

/* ---------- a child's session: opened when the teacher taps the child, closed when they go back ---------- */
function progressOf(p){ return {games:p.games||{}, best:p.best||{}, review:p.review||[], words:p.words||{}, practiceDays:p.practiceDays||[], bonus:p.bonus||0, subject:p.subject||subject, last:p.last||0}; }
function saveChildProgress(){
  if(SCH.preview || !SCH.child || !me) return;
  const pr=progressOf(me); store.school.cache=store.school.cache||{}; store.school.cache[SCH.child.id]=pr;
  const from=obBusy?1:0;   // only the newest copy needs sending
  store.school.outbox=(store.school.outbox||[]).filter((it,i)=> i<from || !(it.fn==='save_progress' && it.args.p_child_id===SCH.child.id));
  obPush('save_progress', {p_child_id:SCH.child.id, p_progress:pr});
}
function startChildSession(){
  if(SCH.preview || !SCH.child) return;
  SCH.session={id:uuid(), started:Date.now()};
  obPush('open_session', {p_session_id:SCH.session.id, p_child_id:SCH.child.id, p_task_type:'in_class', p_started_at:new Date().toISOString()});
}
function endChildSession(){
  if(SCH.child && !SCH.preview) saveChildProgress();
  if(SCH.session){ obPush('end_session', {p_session_id:SCH.session.id, p_minutes:Math.round((Date.now()-SCH.session.started)/6000)/10}); }
  SCH.session=null; SCH.cls=null; SCH.child=null;
}
function leaveChild(){ const wasPreview=SCH.preview; endChildSession(); SCH.preview=false; me=null; openSchool(wasPreview?'classes':'children'); }
function schoolRound(rec){
  if(SCH.preview || !SCH.child) return;
  saveChildProgress();
  if(rec.game_id==='placement' || !SCH.session) return;
  const first=(rec.items[0]||{}).game || rec.game_id, gg=GAMES[first]||{};
  obPush('record_round', {p_round_id:uuid(), p_session_id:SCH.session.id, p_subject:gg.skill?'english':'maths', p_game:rec.game_id,
    p_skill:rec.game_id==='review'?'Review':(gg.skill||gg.name||rec.game), p_level:rec.level||0, p_questions:rec.questions,
    p_right_first_time:rec.right_first_try, p_stars:Math.max(0,Math.min(3,rec.stars||0)),
    p_missed:rec.items.filter(i=>!i.ok).map(i=>({game:i.game, answer:String(i.answer)})).slice(0,20),
    p_played_at:new Date(Date.now()-rec.seconds*1000).toISOString()});
}
function profileFromChild(c, pr){
  pr=pr||{};
  return {id:c.id, name:c.name, age:c.age||5, color:hashColor(c.id), games:pr.games||{}, best:pr.best||{}, review:pr.review||[], words:pr.words||{},
    practiceDays:pr.practiceDays||[], bonus:pr.bonus||0, subject:pr.subject, last:pr.last||0, band:classCfg(c.class_name).band};
}
async function openChild(id, btn){
  const listed=(SCH.kids||[]).find(x=>x.id===id), cached=(store.school.cache||{})[id];
  let c=null;
  await busy(btn, async()=>{
    try{ c=await rpc('child_open', {p_token:tokenOf(), p_child_id:id}); }
    catch(e){
      if(e.code==='invalid_token') return needLogin();
      if(e.offline && listed){ c=Object.assign({}, listed, {class_name:SCH.klass.name, progress:cached||{}, start_done_at:listed.start_score!=null?'done':null}); toast('No internet. Results will be sent later.'); }
      else { setErr('sErr', serr(e)); }
    }
  });
  if(!c) return;
  let pr=c.progress||{}; if(cached && (cached.last||0)>(pr.last||0)) pr=cached;   // this phone may hold newer, unsent progress
  SCH.child={id:c.id, name:c.name, start_done:!!c.start_done_at};
  SCH.cls={id:c.class_id, name:c.class_name||(SCH.klass&&SCH.klass.name)||'Standard 2'};
  SCH.preview=false;
  me=profileFromChild(Object.assign({}, c, {class_name:SCH.cls.name}), pr);
  subject=me.subject==='english'?'english':'maths';
  startChildSession();
  SCH.child.start_done ? openGames() : startStarting();
}
function openPreview(k){
  SCH.preview=true; SCH.child=null; SCH.session=null; SCH.cls={id:k.id, name:k.name};
  const c=classCfg(k.name), games={};
  c.maths.concat(c.english).forEach(id=>{ games[id]={unlocked:capOf(id), stars:{}, plays:0, right:0, tries:0, last:0}; });   // every level open, to check the questions
  me={id:'preview', name:(store.school&&store.school.teacher)||'Teacher', age:5, color:AVCOL[0], games, best:{}, review:[], words:{}, practiceDays:[], bonus:0, band:c.band, last:0};
  subject='maths'; openGames();
}

/* ---------- starting exercise: 8 questions from the class's games, once per child ---------- */
function startStarting(){
  const c=classCfg(SCH.cls.name), lvls=[1,3,5,7];
  const mp=c.maths.filter(id=>!GAMES[id].isSprint), ep=c.english.filter(id=>START_EN.includes(id));
  const at=(pool,i)=>pool[Math.floor(i*pool.length/4)], list=[];
  for(let i=0;i<4;i++){ const m=at(mp,i); list.push([m, Math.min(capOf(m), lvls[i])]); if(ep.length){ const e=at(ep,i); list.push([e, Math.min(capOf(e), lvls[i])]); } }
  practice=null; stopSprint(); logRound(false);
  placing={start:true, list, n:0, max:list.length, hist:[]};
  game='placement'; level=0; plan=[];
  round={game:'placement', level:0, started:Date.now(), items:[], logged:false};
  show('sPlay'); $('qbar').style.width='0%';
  $('pTitle').textContent='Starting exercise';
  $('pText').textContent='Starting exercise';
  $('stage').innerHTML=`<div class="cele">${mascotSVG('happy')}</div><p style="font-size:20px;font-weight:600;text-align:center;margin:0">A few questions to find<br>where ${esc(me.name)} should start.</p>`;
  say(`Hi ${me.name}! Let's start with a few questions.`).then(()=>{ if(placing) placeQ(); });
}
function finishStarting(){
  const right=placing.hist.filter(h=>h.ok).length, total=placing.hist.length; placing=null;
  const r=total?right/total:0, start=r<0.4?1 : r<0.65?2 : r<0.9?3 : 4, c=classCfg(SCH.cls.name);
  c.maths.concat(c.english).forEach(id=>{ const g=gp(me,id); g.unlocked=Math.max(g.unlocked||1, Math.min(start, capOf(id))); });
  if(round){ round.stars=0; round.passed=true; } logRound(true);   // saves the child's progress
  if(!SCH.preview && SCH.child){ SCH.child.start_done=true; obPush('save_start_score', {p_child_id:SCH.child.id, p_score:right, p_total:total}); }
  show('sDone'); bigCelebration();
  $('result').innerHTML=`<div class="cele">${mascotSVG('cheer')}</div><h2>All done, ${esc(me.name)}!</h2><p>Your games are ready.</p>
    <div class="placednote">For the teacher: ${right} of ${total} right. ${esc(me.name)} starts at <b>level ${start}</b> in each game.</div>
    <div class="btns"><button class="btn primary" id="placedGo">Let's play ▶</button></div>`;
  say(`Great job, ${me.name}! Your games are ready. Let's play!`);
}

let round=null, dbRef=null, dbState='checking', dlRef=null;

/* ---------- live results: sent to the organiser's Google Sheet as soon as each level ends ---------- */
const LIVE = { url: 'https://script.google.com/macros/s/AKfycbxrjokxVXg0WQwSPfD9SXMqzU-GAGlS_xjYnIwJBwIusW7GEXeBlWbxdD30GxO6cNXKtg/exec', key: 'tiri-2026-amf' };
let liveBusy=false, liveState='', liveLast=0;
function livePending(){ return store.sessions.filter(r=>!r.live).length + store.profiles.filter(p=>p.dirty).length + (store.removed||[]).length; }
async function liveSync(){
  if(!LIVE.url || !STANDALONE || liveBusy) return;
  if(navigator.onLine===false){ liveState='offline'; return; }
  liveBusy=true;
  try{
    for(let guard=0; guard<20; guard++){
      const kids=store.profiles.filter(p=>p.dirty), gone=(store.removed||[]).slice(0,20), rounds=store.sessions.filter(r=>!r.live).slice(0,50);
      if(!kids.length && !gone.length && !rounds.length) break;
      const body={ key:LIVE.key, family:store.family||'', device:store.device,
        children: kids.map(p=>({child_id:p.id, child:p.name, age:p.age, stars:starTotal(p)})).concat(gone),
        rounds: rounds.map(({items,synced,live,...r})=>r) };
      await fetch(LIVE.url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
      kids.forEach(p=>delete p.dirty); rounds.forEach(r=>r.live=true); store.removed=(store.removed||[]).slice(gone.length);
      liveLast=Date.now(); liveState='ok'; save();
    }
  }catch(e){ liveState='offline'; }
  finally{ liveBusy=false; if(current==='sParent') renderParent(); }
}

const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v||'');
function logRound(completed){

  const rec={
    id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    date:`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`, time:`${pad2(d.getHours())}:${pad2(d.getMinutes())}`,
    child:me.name, child_age:me.age, child_id:me.id, age_group:GROUPS[bandOf(me)].label.replace('Ages ','').replace('–','-'),

    stars:round.stars||0, passed:!!round.passed, seconds:Math.round((Date.now()-round.started)/1000), completed:!!completed,
    sprint_score: round.game==='sprint'?right:null, device:store.device, items, synced:false
  };
  if(SCH.cls){ schoolRound(rec); round=null; return; }      // school children are saved to the school database, not this device's log
  store.sessions.push(rec); if(store.sessions.length>1500) store.sessions=store.sessions.slice(-1500);
  me.dirty=true; save(); round=null; syncPending(); liveSync();

let syncing=false;
async function syncPending(){
  if(!dbRef||syncing) return; syncing=true;
  try{ for(const rec of store.sessions.filter(r=>!r.synced).slice(0,40)){ const {synced,...data}=rec;
      try{ await dbRef.collection('sessions').doc(rec.id).set(data); rec.synced=true; save(); }
      catch(e){ dbState=(e&&/permission|not_granted|denied|auth/i.test(e.code||''))?'denied':'error'; break; } }
  } finally { syncing=false; if(current==='sParent') renderParent(); }
}
(async()=>{ try{ if(!window.claude||!window.claude.use){ dbState='off'; return; }
  const [db,dl]=await Promise.all([claude.use('db'),claude.use('downloads')]); dbRef=db; dlRef=dl; dbState=db?'on':'off';
  if(current==='sParent') renderParent(); syncPending(); }catch(e){ dbState='off'; } })();
const CSV_COLS=['id','date','time','child','child_age','age_group','game','level','questions','right_first_try','wrong_tries','answers_shown','stars','passed','seconds','completed','sprint_score','device'];
function toCSV(){ const q=v=>{ if(v===null||v===undefined) return ''; const s=String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  return [CSV_COLS.join(',')].concat(store.sessions.map(r=>CSV_COLS.map(c=>q(r[c])).join(','))).join('\n'); }
function totals(p){ const rs=store.sessions.filter(r=>r.child_id===p.id); return {rounds:rs.length, answers:rs.reduce((a,r)=>a+r.questions,0), right:rs.reduce((a,r)=>a+r.right_first_try,0), wrong:rs.reduce((a,r)=>a+r.wrong_tries,0)}; }

function csvName(){ const d=new Date(); return `tiri-${store.device}-${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}.csv`; }
function summaryText(){ return resultsMessage().split('\n--- Spreadsheet data')[0].trim(); }
async function shareResults(){
  const summary=summaryText();
  try{
    const file = typeof File==='function' ? new File([toCSV()], csvName(), {type:'text/csv'}) : null;
    if(file && navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({title:'Tiri results', text:summary, files:[file]});
    else await navigator.share({title:'Tiri results', text:resultsMessage()});
    dataMsg='';

}
function emailResults(){
  let body=resultsMessage();
  if(body.length>7000){ const lines=body.split('\n'); while(lines.join('\n').length>6800 && lines.length>12) lines.splice(lines.findIndex(l=>/^s[a-z0-9]+,/.test(l)),1); body=lines.join('\n')+'\n(Older rounds left out to fit the email. Use Download spreadsheet for everything.)'; }
  const names=store.profiles.map(p=>p.name).join(', ');
  location.href=`mailto:${encodeURIComponent(store.sendTo)}?subject=${encodeURIComponent('Tiri results'+(names?' — '+names:''))}&body=${encodeURIComponent(body)}`;
}
function resultsMessage(){
  const d=new Date(), today=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const lines=[`Tiri results — ${today} — device ${store.device}`,''];
  store.profiles.forEach(p=>{ const t=totals(p), acc=t.answers?Math.round(100*t.right/t.answers):0;
    const lv=GROUPS[bandOf(p)].games.concat(ENGLISH.games).filter(id=>!GAMES[id].isSprint&&p.games[id]&&levelsDone(p.games[id])).map(id=>`${GAMES[id].name} ${levelsDone(p.games[id])}/10`).join(', ');
    lines.push(`${p.name} (age ${p.age}): ${t.rounds} rounds played, ${t.answers} answers, ${t.right} right first time (${acc}%), ${t.wrong} wrong tries.${lv?` Levels completed: ${lv}.`:''}`); });
  lines.push('','--- Spreadsheet data (paste into Excel; each round has a unique id) ---',toCSV());
  return lines.join('\n');
}

/* ---------- play ---------- */
/* Each question is built from a seed, so a question the child missed can be asked again exactly. */
let plan=[];
function makeQ(gid, lv, seed){
  const sd = seed==null ? (Math.random()*4294967296)>>>0 : seed;
  _seed = sd; const qq = GAMES[gid].make(lv); qq.gid=gid; qq.level=lv; qq.seed=sd; return qq;
}
const REVIEW_GAP = 3*60*1000;   // a missed question comes back after a few minutes, not straight away
function addReview(qq){
  if(!me||!qq||!qq.gid) return; me.review=me.review||[];
  const r=me.review.find(x=>x.g===qq.gid&&x.s===qq.seed);
  if(r){ r.n++; r.t=Date.now(); } else { me.review.push({g:qq.gid, lv:qq.level, s:qq.seed, n:1, t:Date.now()}); if(me.review.length>40) me.review.shift(); }
}
function clearReview(qq){ if(me&&me.review) me.review=me.review.filter(x=>!(x.g===qq.gid&&x.s===qq.seed)); }
function dueReviews(gid){ const ok=new Set(G().games); return (me.review||[]).filter(r=>ok.has(r.g) && (!gid||r.g===gid) && Date.now()-r.t>=REVIEW_GAP); }
function buildPlan(gid, lv){
  if(gid==='review') return dueReviews().sort((x,y)=>y.n-x.n||x.t-y.t).slice(0,6).map(r=>({g:r.g,lv:r.lv,s:r.s,review:true}));
  const N=G().perLevel, out=Array.from({length:N},()=>({g:gid,lv}));
  const due=dueReviews(gid).filter(r=>r.lv<=lv).slice(0, N>=8?2:1);
  const spots=[...Array(N-1).keys()].map(i=>i+1).sort(()=>Math.random()-.5);   // never the first question
  due.forEach((r,i)=>{ out[spots[i]]={g:r.g,lv:r.lv,s:r.s,review:true}; });
  return out;
}

/* ---------- today's practice ---------- */
let practice=null;
const dayStr = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayStr = () => dayStr(new Date());
function practiceDays(p){
  const days=new Set(p.practiceDays||[]), d=new Date(); let n=0;
  if(!days.has(dayStr(d))) d.setDate(d.getDate()-1);
  while(days.has(dayStr(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function buildPractice(){
  const ids=(G().practiceGames||G().games).filter(id=>!GAMES[id].isSprint);
  const st=ids.map(id=>{ const g=gp(me,id); return {id, acc:g.tries>=3?g.right/g.tries:null, done:levelsDone(g), last:g.last||0}; });
  const used=new Set(), steps=[];
  if(dueReviews().length) steps.push({g:'review', lv:0});
  const take = x => { if(x && !used.has(x.id)){ used.add(x.id); steps.push({g:x.id, lv:Math.min(capOf(x.id), gp(me,x.id).unlocked)}); } };
  take(st.filter(x=>x.acc!==null && x.acc<0.75).sort((x,y)=>x.acc-y.acc)[0]);                       // the one that needs practice
  take(st.filter(x=>!used.has(x.id) && x.done<capOf(x.id)).sort((x,y)=>x.last-y.last)[0]);         // keep moving forward, least recently played first
  take(st.filter(x=>!used.has(x.id) && x.acc!==null && x.acc>=0.75).sort((x,y)=>y.last-x.last)[0]); // one they enjoy and are good at
  for(const x of st.slice().sort(()=>Math.random()-.5)){ if(steps.filter(z=>z.g!=='review').length>=3) break; take(x); }
  return steps;
}
function startPractice(){ practice={steps:buildPractice(), i:0}; runPracticeStep(); }
function runPracticeStep(){ const stp=practice.steps[practice.i]; game=stp.g; startLevel(stp.lv); }

function startLevel(n){
  logRound(false);
  level=n; qi=0;
  round={game, level:n, started:Date.now(), items:[], logged:false};
  me.last=Date.now(); save();
  show('sPlay');
  const g0=GAMES[game];
  const label = g0.isSprint||g0.isReview ? g0.name : `${g0.name} · Level ${n}`;
  $('pTitle').textContent = practice ? `Practice ${practice.i+1} of ${practice.steps.length} · ${label}` : label;
  if(g0.isSprint){ startSprint(); return; }
  plan=buildPlan(game,n);
  if(!plan.length){ practice ? nextPracticeOrEnd() : openGames(); return; }
  setBar(); nextQ();
}
function setBar(){ $('qbar').style.width = `${100*qi/Math.max(1,plan.length)}%`; }
function nextQ(){
  if(qi>=plan.length){ finishLevel(); return; }
  const sp=plan[qi];
  if(sp.s!=null) q=makeQ(sp.g, sp.lv, sp.s);
  else { let g=0; do{ q=makeQ(sp.g, sp.lv); }while(!q.pad && q.answer===lastAnswer && g++<8); }
  q.isReview=!!sp.review; lastAnswer=q.answer; renderQ();
  if(G().voice){ const myQ=q; setTimeout(async()=>{ if(q.pre){ await q.pre(); if(q!==myQ) return; } say(q.isReview?['Here is one to try again.', ...questionParts(q)]:questionParts(q)); },250); }
}
function renderQ(){
  $('pText').textContent=q.text;
  $('stage').innerHTML = (q.isReview?'<div class="revtag">🔁 One to try again</div>':'') + q.html + (q.pad ? padHTML(q.decimal) : '');
  typed=''; tries=0; locked=false;
  if(q.mount) q.mount($('stage'));
}
function showWhy(html){
  const st=$('stage'); let w=st.querySelector('.why');
  if(!w){ w=document.createElement('div'); w.className='why'; const tag=st.querySelector('.revtag'); tag?tag.after(w):st.prepend(w); }
  w.innerHTML=html;
}
function padHTML(dec){
  const k=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-key="${n}">${n}</button>`).join('');
  const del=`<button data-key="del" aria-label="Delete"><svg viewBox="0 0 24 24" width="24" height="24" style="stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M9 5h11v14H9l-6-7z"/><path d="M12 9l5 6M17 9l-5 6"/></svg></button>`;
  return dec ? `<div class="pad">${k}<button data-key=".">.</button><button data-key="0">0</button>${del}<button class="go span" data-key="go">Check</button></div>`
             : `<div class="pad">${k}${del}<button data-key="0">0</button><button class="go" data-key="go" aria-label="Check">✓</button></div>`;
}
function updateSlot(){ const s=$('slot'); if(!s) return; s.textContent=typed||'?'; s.classList.toggle('empty',!typed); }
function onKey(k){
  if(locked) return; audio();
  if(k==='del'){ typed=typed.slice(0,-1); updateSlot(); return; }
  if(k==='go'){ if(typed&&typed!=='.') submitTyped(); return; }
  if(k==='.'&&typed.includes('.')) return;
  if(typed.length>=7) return;
  typed+=k; updateSlot(); tick();
  if(sprint && typed.length>=q.answer.length) setTimeout(()=>{ if(sprint&&typed) submitTyped(); },140);
}
const isRight = () => q.decimal ? Math.abs(parseFloat(typed)-parseFloat(q.answer))<1e-9 : typed.replace(/^0+(?=\d)/,'')===q.answer;
function submitTyped(){
  if(placing){ placeAnswer(isRight()); return; }
  if(sprint){ sprintAnswer(isRight()); return; }
  const s=$('slot');
  if(isRight()){ locked=true; s.classList.add('ok'); ding(); burst(s); celebrateCorrect(); completeQ(tries===0, false, async()=>{ if(G().voice) await say(`Correct! ${speakify(q.explain)}.`); else await wait(700); }); return; }
  tries++; boop(); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); typed=''; setTimeout(updateSlot,300);
  if(tries===1){ const h=q.hint||maskHint(q); if(h){ showWhy(h.html); if(G().voice) say(['Not quite. Here is a hint.', h.say]); return; } }
  if(tries>=2){ locked=true;
    setTimeout(async()=>{ s.textContent=q.answer; s.classList.remove('empty'); s.classList.add('reveal'); $('pText').textContent=q.explain;
      await say(speakify(q.explain)+'.',{silentMs:2400}); await wait(900); completeQ(false,true); },350);
  } else if(G().voice) say('Not quite. Try again.');
}
function onChoice(btn){
  if(locked) return; audio();
  if(placing){ placeAnswer(btn.dataset.choice===q.answer, btn); return; }
  if(q.seq){
    q.pos=q.pos||0;
    if(btn.classList.contains('right')) return;
    if(btn.dataset.choice===q.seq[q.pos]){
      btn.classList.add('right'); btn.insertAdjacentHTML('beforeend',`<span class="stepno">${q.pos+1}</span>`); q.pos++;
      if(q.pos<q.seq.length){ tick(); return; }
      locked=true; ding(); burst(btn); celebrateCorrect(); completeQ(tries===0,false,q.seqDone||(()=>say(pick(['Well done! You did it all!','Great listening!','Yes! All done!'])))); return;
    }
    tries++; boop(); btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
    q.pos=0; $('stage').querySelectorAll('.opt.right').forEach(b=>{ b.classList.remove('right'); const n=b.querySelector('.stepno'); if(n) n.remove(); });
    if(tries>=2){ const first=choiceBtn($('stage'),q.seq[0]); if(first) first.classList.add('pulse'); }
    say(q.seqRetry ? (tries>=2?[q.seqRetry,'Start with the one that is shining.']:q.seqRetry) : tries>=2?['Start again. Listen.', q.seqSay, 'Start with the one that is shining.']:['Oops! Start again. Listen.', q.seqSay]);
    return;
  }
  if(btn.dataset.choice===q.answer){ locked=true; btn.classList.add('right'); ding(); burst(btn); celebrateCorrect();
    completeQ(tries===0,false, q.after ? ()=>q.after($('stage')) : ()=>say(`${pick(['Well done!','Great!','Yes!'])} ${q.praise||''}`)); }
  else {
    tries++; btn.classList.add('wrong'); boop();
    const w = q.why ? q.why($('stage'), btn.dataset.choice, btn) : null;
    if(w && w.html) showWhy(w.html);
    if(tries>=2){ const c=[...$('stage').querySelectorAll('[data-choice]')].find(b=>b.dataset.choice===q.answer); if(c) c.classList.add('pulse'); }
    if(G().voice){ const first=(w&&w.say)||pick(['Try again.','Not that one. Try again.','Almost! Try again.']); say(tries>=2?[first,'Tap the one that is shining.']:first); }
  }
}
function customDone(firstTry, celebrate){ if(locked||!q) return; locked=true; if(firstTry){ ding(); celebrateCorrect(); } else tick(); completeQ(firstTry, false, celebrate||null); }
async function completeQ(firstTry, shown, celebrate){
  if(celebrate) await celebrate();
  const s=gp(me,q.gid); s.tries++; if(firstTry) s.right++; s.last=Date.now();
  if(firstTry){ if(q.isReview) clearReview(q); if(q.word) learnWord(q.word); } else if(!q.noReview) addReview(q);
  if(round) round.items.push({game:q.gid, answer:q.answer, ok:!!firstTry, wrong:tries, shown:!!shown, review:!!q.isReview});
  save(); qi++; setBar(); await wait(350); nextQ();
}
function practiceButtons(){
  if(!practice) return null;
  practice.i++;
  if(practice.i<practice.steps.length) return {btns:`<button class="btn primary" id="pracNext">Continue ▶</button>`, note:`<p class="pracnext">Next: ${GAMES[practice.steps[practice.i].g].name}</p>`, say:'Great! On to the next one.'};
  me.practiceDays=[...new Set([...(me.practiceDays||[]), todayStr()])].slice(-90); save(); practice=null;
  const d=practiceDays(me);
  return {btns:`<button class="btn primary" id="pracEnd">Back to games</button>`, note:`<div class="pracdone">🌟 Today's practice is done! · ${d} day${d>1?'s':''} in a row</div>`, say:"Today's practice is done! Great work."};
}
function nextPracticeOrEnd(){ const pb=practiceButtons(); if(pb && practice) runPracticeStep(); else openGames(); }
function cheerLines(passed, stars, lvl){
  const n=me.name;
  if(!passed) return `Good try, ${n}! Every try makes you stronger. Let's play again!`;
  if(stars===3) return pick([`Perfect, ${n}! Three stars! You are making very good progress!`, `Wow, ${n}! All right! You are doing brilliantly!`]);
  return pick([`Well done, ${n}! You are making very good progress!`, `Amazing, ${n}! Level ${lvl} complete. You are doing great!`, `Fantastic work, ${n}! You are getting better and better!`]);
}
function bigCelebration(){ fanfare(); confetti(70); setTimeout(()=>riseStars(24),300); }
function finishLevel(){
  const items=round?round.items:[], per=plan.length, right=items.filter(i=>i.ok).length, ratio=right/per, little=bandOf(me)==='little';
  if(GAMES[game].isReview){
    if(round){ round.stars=0; round.passed=true; } save(); logRound(true);
    const left=per-right, pb=practiceButtons();
    show('sDone'); bigCelebration();
    $('result').innerHTML=`<div class="cele">${mascotSVG('cheer')}</div><h2>Review done, ${esc(me.name)}!</h2><p>${right} of ${per} right first time.${left?` ${left} will come back later.`:' All fixed!'}</p>
      ${pb?pb.note:''}<div class="btns">${pb?pb.btns:'<button class="btn primary" id="levelsBtn">Back to games</button>'}</div>`;
    say(pb?[`Well done, ${me.name}! You fixed ${right} of them.`, pb.say]:`Well done, ${me.name}! You are making very good progress!`);
    return;
  }
  let stars = ratio>=0.99?3 : ratio>=0.7?2 : ratio>=0.5?1 : 0;
  if(little) stars=Math.max(1,stars);

  s.plays++;
  if(passed){ s.stars[level]=Math.max(s.stars[level]||0,stars); if(level===s.unlocked&&level<cap) s.unlocked=level+1; }
  if(round){ round.stars=stars; round.passed=passed; }
  save(); logRound(true);
  show('sDone');
  if(passed) bigCelebration();
  const last=level>=cap, pb=practiceButtons(), after=Math.min(cap,levelsDone(s));
  $('result').innerHTML=`<div class="cele">${mascotSVG(passed?'cheer':'happy')}</div>
    <div class="bigstars">${[1,2,3].map(i=>`<span class="${i<=stars?'on':''}">★</span>`).join('')}</div>
